<script>
const TEAM_COLOR = {

  DEN:"#FEC524", DET:"#1D42BA", GS:"#FFC72C", HOU:"#D31145", IND:"#FDBB30", LAC:"#3B6FD8", LAL:"#8E5ED8",
  MEM:"#5D76A9", MIA:"#E0245E", MIL:"#00A651", MIN:"#78BE20", NO:"#B4975A", NY:"#F58426", OKC:"#007AC1",
  ORL:"#0077C0", PHI:"#006BB6", PHX:"#E56020", POR:"#E03A3E", SAC:"#8A5CC8", SA:"#A2AAAD", TOR:"#CE1141",
  UTAH:"#F9A01B", WSH:"#E31837",
};
const TEAMS = {ATL:"Hawks",BOS:"Celtics",BKN:"Nets",CHA:"Hornets",CHI:"Bulls",CLE:"Cavaliers",DAL:"Mavericks",
  DEN:"Nuggets",DET:"Pistons",GS:"Warriors",HOU:"Rockets",IND:"Pacers",LAC:"Clippers",LAL:"Lakers",MEM:"Grizzlies",
  MIA:"Heat",MIL:"Bucks",MIN:"Timberwolves",NO:"Pelicans",NY:"Knicks",OKC:"Thunder",ORL:"Magic",PHI:"76ers",PHX:"Suns",
  POR:"Trail Blazers",SAC:"Kings",SA:"Spurs",TOR:"Raptors",UTAH:"Jazz",WSH:"Wizards"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const color = t => TEAM_COLOR[t] || "#949cab";
/* Sportsbook logos: each book's own site icon (via Google's public favicon service); if it can't load, a small letter badge */
const BOOKS = {DraftKings: {site: "sportsbook.draftkings.com", short: "DK", bg: "#0b0b0b", fg: "#53d337"},
               FanDuel: {site: "sportsbook.fanduel.com", short: "FD", bg: "#1493ff", fg: "#fff"}};
const bookKey = n => /draft/i.test(n || "") ? "DraftKings" : /fan ?duel/i.test(n || "") ? "FanDuel" : null;
function bookLogo(n, size = 16) {
  const k = bookKey(n); if (!k) return "";
  const b = BOOKS[k];
  return `<img class="booklogo" src="https://www.google.com/s2/favicons?domain=${b.site}&sz=64" width="${size}" height="${size}" alt=""
    onerror="this.outerHTML='<span class=&quot;booklogo txt&quot; style=&quot;background:${b.bg};color:${b.fg};width:${size}px;height:${size}px&quot;>${b.short}</span>'">`;

  blazers:"POR",kings:"SAC",spurs:"SA",raptors:"TOR",jazz:"UTAH",wizards:"WSH"};
const nickCode = n => { n = String(n || "").toLowerCase();
  return Object.keys(NICK).sort((a, b) => b.length - a.length).map(k => n.endsWith(k) ? NICK[k] : "").find(Boolean) || ""; };

function parseDK(d) {

    const side = {}; for (const p of e.participants || []) side[p.venueRole] = nickCode(p.name);
    if (side.Home && side.Away) games[e.id] = {key: `${side.Away}@${side.Home}`};
  }
  for (const m of d.markets || []) kind[m.id] = [String(m.eventId), (m.marketType || {}).name || m.name];
  for (const s of d.selections || []) {

    const o = dkNum((s.displayOdds || {}).american), main = (s.tags || []).includes("MainPointLine"), t = s.outcomeType;
    if (mt === "Moneyline" && (t === "Home" || t === "Away")) g[t.toLowerCase() + "_ml_close"] = o;
    else if (mt === "Spread" && main && (t === "Home" || t === "Away")) { g[t.toLowerCase() + "_spread_odds_close"] = o; if (t === "Home") g.spread_close = s.points; }

async function sendToRelay(games) {

  if (!STATIC || !dataKey || !window.RELAY_URL) return;

    else if (v.kind === "against") out.push(`<div class="mv against">⚠️ <b>${name} moving against us:</b> ${path} · ${ours}.

  const note = conf(H) && conf(A) ? "The picks below use the confirmed starters."
    : conf(H) || conf(A) ? "Picks use the confirmed starters where posted, and the injury report for the rest."
    : "Less accurate until lineups are confirmed: these picks use the injury report's best guess of who plays, so they can shift when teams confirm their starters about 30 minutes before tip-off.";
  const raised = ["home", "away"].flatMap(s => ((lu[s] || {}).raised || []).map(n => `${esc(n)} (${esc(g[s])})`));
  const list = ["home", "away"].filter(s => lu[s]).map(s =>
    `<div><b>${esc(g[s])}</b> ${lu[s].starters.map(esc).join(", ")}</div>`).join("");
  return `<div class="lineup ${conf(H) && conf(A) ? "ok" : "warn"}">${conf(H) && conf(A) ? icon : "⚠️"} <b>Starting lineups:</b> ${status}.
    <span class="dim">${note}</span>
    ${raised.length ? `<div class="raised">Confirmed starting, now counted as playing: <b>${raised.join(", ")}</b></div>` : ""}
    <details><summary>See starters</summary>${list}</details></div>`;
}
function h2hLine(g) {
  const h = g.h2h || {};
  if (!h.games) return `<div class="h2h">🤝 Head to head: first meeting since our data starts (2023-24)</div>`;
  const lead = h.wins[g.home] === h.wins[g.away] ? `Tied ${h.wins[g.home]}–${h.wins[g.away]}`
    : h.wins[g.home] > h.wins[g.away] ? `${esc(g.home)} leads ${h.wins[g.home]}–${h.wins[g.away]}` : `${esc(g.away)} leads ${h.wins[g.away]}–${h.wins[g.home]}`;
  return `<div class="h2h"><div>🤝 Head to head: <b>${lead}</b></div>
    <div class="dim">${h.games} game${h.games === 1 ? "" : "s"} since 2023-24 · last meeting: ${esc(h.last)}</div></div>`;
}

function scoreboard(g) {
  const s = state.live[`${g.away}@${g.home}`];
  if (!s || s.state === "pre") return `<div class="score" style="font-size:22px;color:var(--muted)">vs</div>`;
  const lead = s.home > s.away ? "home" : s.away > s.home ? "away" : "";
  return `<div class="score live-score"><span class="${lead === "home" ? "" : "trail"}">${s.home}</span><span class="dash">–</span><span class="${lead === "away" ? "" : "trail"}">${s.away}</span></div>`;
}
function statusLine(g) {
  const s = state.live[`${g.away}@${g.home}`];
  if (s && s.state === "in") return `<span class="status is-live"><span class="livedot red"></span>LIVE · ${esc(s.detail)}</span>`;
  if (s && s.state === "post") {
    const won = s.home > s.away ? g.home : g.away;
    const right = won === g.favorite;
    return `<span class="status">🏁 Game over · ${right ? `✅ ${esc(won)} won, like we picked` : `❌ ${esc(won)} won, we picked ${esc(g.favorite)}`}</span>`;
  }
  return `<span class="status">🕖 ${esc(g.tip)}</span>`;
}

/* ---------- Games ---------- */
function dayLabel(d) {
  const t = new Date(), iso = x => x.toLocaleDateString("en-CA"), tm = new Date(t); tm.setDate(t.getDate() + 1);
  const name = new Date(d + "T12:00").toLocaleDateString(undefined, {weekday: "long", month: "long", day: "numeric"});
  return d === iso(t) ? "Tonight · " + name : d === iso(tm) ? "Tomorrow · " + name : name;
}

function gameCard(g, bets, i) {
  // headline: our model's win chance, with each sportsbook's right next to it
  const homeWin = g.p_home, awayWin = 1 - g.p_home, dk = g.dk || {}, fd = g.fd || {};
  const modelHome = g.p_home, modelAway = 1 - g.p_home;
  const spreadBook = b => b.spread_close == null ? "–" : `${g.home} ${sp(b.spread_close)}`;
  const totBook = b => b.total_close == null ? "–" : f1(b.total_close);
  const mlBook = b => b.home_ml_close == null ? "–" : `${g.home} ${odds(b.home_ml_close)}<br>${g.away} ${odds(b.away_ml_close)}`;
  const be = o => o < 0 ? -o / (-o + 100) : 100 / (o + 100);
  const bookPct = b => {               // the book's own win chance, with its cut taken out
    if (b.home_ml_close == null || b.away_ml_close == null) return "–";
    const h = be(b.home_ml_close), a = be(b.away_ml_close);
    return `${g.home} ${pct(h / (a + h))}<br>${g.away} ${pct(a / (a + h))}`;
  };
  // owner (21 Nov): only our predicted winner's spread/moneyline, "Opened at" under every sportsbook number,
  // our % on the moneyline row, and which side (Over/Under) we pick on the total
  const homeFav = modelHome >= 0.5, fav = homeFav ? g.home : g.away;
  const tg = ((state.moves || {}).games || []).find(x => x.home === g.home && x.away === g.away) || {};
  const opened = name => { const o = {...(((tg.books || []).find(b => b.book === name) || {}).first || {})};
    if (name === "DraftKings") { if (o.spread == null) o.spread = g.spread_open; if (o.total == null) o.total = g.total_open; }
    return o; };
  const dkO = opened("DraftKings"), fdO = opened("FanDuel");
  const op = (v, f) => v == null ? "" : `<span class="moved">Opened at ${f(v)}</span>`;
  const sideSp = v => v == null ? null : homeFav ? v : -v;
  const spreadBook2 = (b, o) => b.spread_close == null ? "–" : `${fav} ${sp(sideSp(b.spread_close))}${op(sideSp(o.spread), sp)}`;
  const totBook2 = (b, o) => b.total_close == null ? "–" : `${f1(b.total_close)}${op(o.total, f1)}`;
  const mlKey = homeFav ? "home_ml" : "away_ml";
  const mlBook2 = (b, o) => b[mlKey + "_close"] == null ? "–" : `${fav} ${odds(b[mlKey + "_close"])}${op(o[mlKey], odds)}`;
  const tLine = dk.total_close ?? fd.total_close;
  const tSide = tLine == null || Math.abs(g.pred_total - tLine) < 0.5 ? "" : g.pred_total > tLine ? "Over " : "Under ";
  const top = bets.filter(b => b.game_id === g.game_id).sort((a, b) => b.ev - a.ev)[0];
  const outList = ["home", "away"].flatMap(s => (g.out[s] || []).map(p =>
      `<span class="chip">${esc(g[s])} · ${esc(p.name)} ${p.chance === 0 ? "out" : pct(p.chance) + " to play"}</span>`));
  // players who will play but on limited minutes (their news note says "minutes restriction")
  outList.push(...["home", "away"].flatMap(s => ((g.restricted || {})[s] || []).map(n =>
      `<span class="chip">${esc(g[s])} · ${esc(n)} ⏱️ confirmed minutes restriction</span>`)));
  // owner (21 Nov): list every injury, no "+N more" button
  const outs = outList.join("");
  const inj = g.injury_total != null && Math.abs(g.injury_total) >= 0.5
    ? `<div class="inj-note">Injuries move the predicted total <b>${g.injury_total > 0 ? "up" : "down"} ${Math.abs(g.injury_total).toFixed(1)} points</b>.</div>` : "";
  return `<article class="card enter" style="--i:${i};--away-c:${color(g.home)};--home-c:${color(g.away)}">
    <div class="card-head">
      <div class="head-meta"><span class="badge">${esc(g.favorite)} favored</span>
        ${eventBadge(g.event)}
        ${isNeutral(g) ? `<span class="badge neutral">📍 Neutral court${(state.live[`${g.away}@${g.home}`] || {}).city ? " · " + esc(state.live[`${g.away}@${g.home}`].city) : ""}</span>` : ""}
        ${statusLine(g)}</div>
      <div class="mu">
        <div class="tm">${logo(g.home)}<div>${esc(g.home)}<small>${esc(TEAMS[g.home] || "")} · ${siteLabel(g, "home")}</small>${recLine(g, g.home)}</div></div>
        ${scoreboard(g)}
        <div class="tm home"><div>${esc(g.away)}<small>${esc(TEAMS[g.away] || "")} · ${siteLabel(g, "away")}</small>${recLine(g, g.away)}</div>${logo(g.away)}</div>
      </div>
    </div>
    <div class="card-body">
      ${h2hLine(g)}
      ${lineupLine(g)}
      <div class="predscore"><span class="lbl">🎯 Predicted score</span>
        <span><b>${esc(g.home)} ${Math.round(g.pred_home)}</b> – <b>${esc(g.away)} ${Math.round(g.pred_away)}</b></span></div>
      <div class="winrow"><span>${pct(homeWin)}</span>
        <div class="winbar"><i style="width:${(100 * homeWin).toFixed(1)}%;background:${color(g.home)}"></i><i style="width:${(100 * awayWin).toFixed(1)}%;background:${color(g.away)}"></i></div>
        <span>${pct(awayWin)}</span></div>
      <div class="wincmp">
        <div class="wc-h">Chance to win tonight</div>
        <div class="wc-row model"><span class="wc-src">🎯 Our model</span><span class="wc-pct"><b>${esc(g.home)} ${pct(homeWin, 1)}</b> · ${esc(g.away)} ${pct(awayWin, 1)}</span></div>
        ${[["DraftKings", dk], ["FanDuel", fd]].map(([name, b]) => b.home_ml_close == null || b.away_ml_close == null ? "" : (() => {
          const hb = be(b.home_ml_close), ab = be(b.away_ml_close);
          return `<div class="wc-row"><span class="wc-src">${book(name)}</span><span class="wc-pct"><b>${esc(g.home)} ${pct(hb / (hb + ab), 1)}</b> · ${esc(g.away)} ${pct(ab / (hb + ab), 1)}
            <small>${esc(g.home)} ${odds(b.home_ml_close)} / ${esc(g.away)} ${odds(b.away_ml_close)}</small></span></div>`; })()).join("")}
      </div>
      <div class="wintext">Predicted total points (both teams): <b>${Math.round(g.pred_total)}</b></div>
      <table class="bk lines">
        <tr><th></th><th>Our model</th><th>${book("DraftKings", 14)}</th><th>${book("FanDuel", 14)}</th></tr>
        <tr><td>Spread</td><td class="model">${fav} ${sp(homeFav ? -g.pred_margin : g.pred_margin)}</td><td>${spreadBook2(dk, dkO)}</td><td>${spreadBook2(fd, fdO)}</td></tr>
        <tr><td>Total</td><td class="model">${tSide}${f1(g.pred_total)}</td><td>${totBook2(dk, dkO)}</td><td>${totBook2(fd, fdO)}</td></tr>
        <tr><td>Moneyline</td><td class="model">${fav} ${pct(homeFav ? modelHome : modelAway, 1)}</td><td>${mlBook2(dk, dkO)}</td><td>${mlBook2(fd, fdO)}</td></tr>
      </table>
      ${moveAlerts(g)}
      ${g.trust != null && g.trust < 1 ? `<div class="fade">⏳ Close to tip-off: our model counts for ${Math.round(100 * g.trust)}% of its usual weight, and 0% at tip-off. In past seasons, by tip-off the sportsbook's line was the best guess, so late edges shrink.</div>` : ""}
      ${top ? `<div class="value">💰 Best value: ${esc(pickName(top.pick))} at ${book(top.book)} ${odds(top.odds)}
        <span>— we expect this bet to win ${pct(top.chance)} of the time. At ${odds(top.odds)} the sportsbook's price treats it as a ${pct(top.breakeven)} chance, so the bet is underpriced by ${(100 * (top.chance - top.breakeven)).toFixed(0)} points.</span>
        <small class="why">Our chance blends our model with the sportsbook's own line, the way professional bettors do, so it isn't overconfident.</small></div>`
        : `<div class="noedge">🤝 No edge on this game: our chances and the sportsbooks' prices agree, so no bet here has our chance at least 4 points above what its odds need.</div>`}
      ${(g.safe || []).length ? `<div class="alts safe"><div class="alts-h">🔒 Safest picks <small>bets on tonight's game that we give a 70%+ chance to win, where our chance is at least as high as the sportsbook's</small></div>${g.safe.slice(0, 2).map(x =>
        `<div class="alt-row"><b>${esc(pickName(x.pick))}</b><span>${book(x.book)} ${odds(x.odds)}</span><span>our chance ${pct(x.chance)} · sportsbook's chance ${pct(x.breakeven)}</span></div>`).join("")}</div>` : ""}
      ${(g.alts || []).length ? `<div class="alts"><div class="alts-h">🎯 Bigger payouts <small>bets that win less often, but pay more than our chance says they should</small></div>${g.alts.slice(0, 2).map(x =>
        `<div class="alt-row"><b>${esc(pickName(x.pick))}</b><span>${book(x.book)} ${odds(x.odds)}</span><span>our chance ${pct(x.chance)} · sportsbook's chance ${pct(x.breakeven)}</span></div>`).join("")}</div>` : ""}
      ${outs ? `<div class="chips">${outs}</div>` : ""}${inj}
    </div>
  </article>`;
}

// "Sun, Nov 22 · 7:00 PM" under every pick's game (owner: picks can be for tomorrow)
// each logo right next to its own team (owner): [logo] PHI vs [logo] MIL
function gameCell(x) {
  const [away, home] = String(x.game).split(" @ ");
  return `<span class="gcell">${logo(home, 20)} ${esc(home)} <span class="muted">vs</span> ${logo(away, 20)} ${esc(away)}</span>`;
}
// owner: an empty Value bets / Bigger payouts tab explains WHY (the rule, today's biggest gap, when they show up)
function emptyWhy(what) {
  const p = state.pred || {}, seen = new Set();
  const gaps = [...(p.favorable || []), ...(p.ours || []), ...(p.safe || [])]
    .filter(x => x.breakeven != null && !seen.has(pickKey(x)) && seen.add(pickKey(x)))
    .map(x => ({x, g: 100 * ((x.chance || 0) - x.breakeven)})).sort((a, b) => b.g - a.g).slice(0, 3);
  const rows = gaps.map(({x, g}) => `<li><b>${esc(pickName(x.pick))}</b> (${esc(vs(x.game))}): we say ${pct(x.chance, 1)}, the sportsbook says ${pct(x.breakeven, 1)} → <b>${g >= 0 ? `${g.toFixed(1)}% higher` : `${(-g).toFixed(1)}% lower`}</b></li>`).join("");
  return `<div class="empty" style="text-align:left">
    <p style="margin:0 0 8px"><b>No ${what} right now.</b> These need our chance to be at least <b>4% higher</b> than the sportsbook's, and nothing is that far off right now.</p>
    ${rows ? `<p style="margin:0 0 4px">Today's biggest gaps:</p><ul style="margin:0 0 8px 18px;padding:0">${rows}</ul>` : ""}
    <p style="margin:0" class="muted">That's normal, especially on small slates and later in the day, after the sportsbooks have sharpened their lines.
      They show up most often <b>early</b>, when lines first open, or <b>right after injury news</b>. Skipping is better than forcing a bet.</p></div>`;
}
function pickWhen(x) {
  const g = ((state.pred || {}).games || []).find(g => g.game_id === x.game_id);
  if (!g || !g.date) return "";
  const d = new Date(g.date + "T12:00").toLocaleDateString("en-US", {weekday: "short", month: "short", day: "numeric"});
  return `<div class="muted" style="font-size:12px;margin-top:2px">${esc(d)}${g.tip ? " · " + esc(g.tip) : ""}</div>`;
}
// Start-time order everywhere (owner): games, and picks by their game's tip-off
const startOf = g => String(g.start_utc || "");
const byStart = (a, b) => startOf(a).localeCompare(startOf(b));
function pickStart(x) {
  const g = ((state.pred && state.pred.games) || []).find(g => g.game_id === x.game_id);
  return g ? startOf(g) : "9";                               // unknown start: last
}
const byPickStart = (a, b) => pickStart(a).localeCompare(pickStart(b));
function gamesView() {
  const p = state.pred;
  if (!p || !p.games || !p.games.length) return `<div class="empty">No upcoming games found. Press <b>🔄 Refresh</b>.</div>`;
  const warn = (p.warnings || []).map(w => `<div class="warn">⚠️ ${esc(w)}</div>`).join("");
  const days = [...new Set(p.games.map(g => g.date))].sort();
  if (!days.includes(state.day)) state.day = days[0];
  const pick = days.length > 1 ? `<div class="actions" style="margin-top:16px">${days.map(d =>
    `<button class="btn secondary daybtn ${d === state.day ? "on" : ""}" data-day="${d}">${esc(dayLabel(d).split(" · ")[0])} · ${p.games.filter(g => g.date === d).length} games</button>`).join("")}</div>` : "";
  const shown = p.games.filter(g => g.date === state.day).sort(byStart);   // owner: earliest game at the top
  return `${glossary(["predscore", "winchance", "favored", "moneyline", "odds", "spread", "total", "fair", "opening", "move", "lineups", "neutral", "h2h"])}
    ${warn}${pick}
    <h2 class="section-title">${dayLabel(state.day)} · ${shown.length} games</h2>
    <div class="cards one-col">${shown.map((g, i) => gameCard(g, p.bets || [], i)).join("")}</div>`;
}

/* ---------- Plain-English dictionary (owner rule: every term on the site is explained for beginners) ---------- */
const GLOSSARY = {
  odds: ["Odds (the price)", "How much a bet pays. <b>−150</b> means you bet $150 to win $100. <b>+150</b> means you bet $100 to win $150. A minus sign = the favourite (pays less), a plus sign = the underdog (pays more). When you win you also get your bet back."],
  moneyline: ["Moneyline (ML)", "A bet on who wins the game, nothing else. \"ATL ML −237\" = bet $237 on the Hawks to win $100 if they win."],
  spread: ["Spread", "A head start in points that makes the game even. <b>ATL −6.5</b> = the Hawks must win by 7 or more. <b>CHA +6.5</b> = the Hornets win the bet if they win, or lose by 6 or less. Spreads on this site are written for the home team unless the team is named."],
  total: ["Total (Over / Under)", "A bet on both teams' points added together. <b>Over 218.5</b> wins if they score 219 or more combined; <b>Under 218.5</b> wins at 218 or less."],
  push: ["Push", "A tie with the line (for example a 7-point win on a −7 spread). Your bet is returned: no win, no loss. A .5 line (−6.5) can never push."],
  favored: ["Favourite / underdog", "The <b>favourite</b> is the team expected to win (minus odds, minus spread). The <b>underdog</b> is expected to lose (plus odds, plus spread)."],
  predscore: ["Predicted score", "What our model thinks the final score will be. Games rarely land exactly on it — it's the middle of what usually happens."],
  winchance: ["Chance to win", "How often we think a team wins this game. 76% means: in 100 games like this one, it wins about 76 and loses about 24. Next to it are DraftKings' and FanDuel's chances, worked out from their odds (with their built-in profit taken out)."],
  fair: ["Fair odds", "The odds that would match our chance exactly, with no sportsbook profit built in. If a sportsbook pays <i>more</i> than our fair odds, that bet is good value."],
  weexpect: ["We expect …%", "Our chance that this bet wins. It mixes our model with the sportsbook's own line (25% our model for spreads, 40% for totals), which tested more accurate than either alone. In the last 6 hours before tip-off our model's share shrinks toward zero, because by then the sportsbook's line is very sharp."],
  bookexpects: ["DraftKings / FanDuel expects …%", "The chance the sportsbook's odds imply. At −110 it's 52.4%: the bet has to win that often just to break even."],
  edge: ["Edge", "Our chance minus the chance the odds need, in percentage points. 58% vs 52% = a 6-point edge. Bigger is better. We only show bets with an edge of 4+ points, because smaller edges lost money in past seasons."],
  value: ["Value bet 💰", "A bet where we think the team wins more often than the odds say — our chance is at least 4 percentage points higher than what the odds need (58% vs 52% = 6 points). Not a sure thing: it means the price is good, so over many such bets you should come out ahead."],
  breakeven: ["Break-even (needs to hit)", "How often a bet at these odds must win for you to neither win nor lose money over many bets. −110 = 52.4%, +100 = 50%, +200 = 33.3%."],
  alt: ["Alternate lines (bigger payouts)", "The same bet at a different number. Instead of ATL −6.5 at −110, you can take ATL −10.5 at +150 (pays more, wins less often) or ATL −2.5 at −200 (pays less, wins more often)."],
  safest: ["Safest picks 🔒", "Bets we give a 70%+ chance to win at a fair price. They win often but pay little (−300 = bet $300 to win $100), so one loss can wipe out several wins."],
  ours: ["Our prediction 🔮", "Our pick for every game: the team we think <b>wins</b>, a <b>spread</b> and a <b>total</b>. The line is our number with the decimal dropped, then the .5 just below (we say Hawks by 8.7 → Hawks −7.5; 218.4 points → Over 217.5), or the Under just above our number when the sportsbook's total is higher than ours. It's our prediction, not a value bet: check the % — some are close to a coin flip."],
  favorable: ["Favorable 👍", "Any pick where our chance to win is higher than the sportsbook's price needs (even by 1 point). Weaker than a <b>value bet</b> (4+ points): small edges like these didn't make money on their own in past seasons, so treat them as parlay fillers, not sure things."],
  parlay: ["Parlay", "Several bets combined into one. It pays much more, but EVERY pick must win — one wrong pick loses the whole bet. Its chance is each pick's chance multiplied together (three 70% picks ≈ 34%)."],
  sgp: ["Same Game Parlay", "A parlay with two or more picks from the same game. Sportsbooks price these themselves (the picks affect each other), so the odds can differ from a normal parlay. A team's moneyline and its spread can't be combined at all."],
  opening: ["Opening line", "The first number a sportsbook posts for a game, usually the day before. It's the easiest one to beat — the book hasn't heard all the news yet."],
  closing: ["Closing line", "The last number before tip-off. By then all the news is out and big bettors have moved it, so it's the sharpest number there is. Beating it over time is the best sign of a good bettor."],
  move: ["Line move 📈", "When a sportsbook changes its number or odds (injury news, lots of money on one side). 📈 moving our way = the book is moving toward our number (good, bet early). ⏰ hasn't moved yet = still at the old number. ⚠️ moving against us = warning. ↔️ moved past our number = the value is gone."],
  betsoon: ["⏰ Bet soon", "The line hasn't caught up with our number yet. In past games, lines usually moved our way later, so the current price is likely the best one."],
  lineups: ["Starting lineups: expected / confirmed", "Who starts the game. <b>Expected</b> = a best guess (early in the day). <b>Confirmed</b> = official, about 30 minutes before tip-off. Our picks get more accurate once lineups are confirmed."],
  neutral: ["📍 Neutral court", "Neither team is at home (for example NBA Cup games in Las Vegas), so neither gets home-court advantage."],
  h2h: ["Head to head", "How these two teams did against each other in past meetings. Shown for interest only — it didn't improve predictions in our tests."],
  injstatus: ["Injury statuses", "<b>Out</b> = won't play. <b>Doubtful</b> = very unlikely to play (1–6%). <b>Questionable / game-time decision</b> = could go either way (34–60% depending on role). <b>Probable</b> = very likely to play (about 93–97% for starters). <b>Minutes restriction</b> = plays, but fewer minutes than usual."],
  linevalue: ["Line value (beat the close)", "How many points the line moved toward our pick between when we made it and tip-off. Positive = we got a better number than the final line — the clearest early sign the picks are good, long before wins and losses settle."],
  record: ["Record (W-L-P)", "Wins – losses – pushes. 12-8-1 = 12 won, 8 lost, 1 push."],
  hit: ["Hit %", "How often the picks won, pushes left out. For spreads and totals at −110 you need 52.4% to make money."],
  margin: ["Margin", "How many points the home team won (or lost) by. Hawks 118, Hornets 104 = a margin of +14 for the Hawks."],
  miss: ["Average miss", "How far our predicted score was from the real one, on average, in points. Lower is better. Even the sportsbooks miss by about 11 points on the margin — basketball is random."],
  calib: ["\"When it says X%, does it happen X%?\"", "A honesty check on our chances: of all the games where we said a team had about 65%, did it really win about 65% of them? If yes, our percentages can be trusted."],

function resultsBlock() {
  const R = (state.track || {}).results || {}, inst = instantGames(), SUMS = withInstant(R.summaries || [], inst),
        G = [...inst, ...(state.resGames || [])];
  if (!state.resGames) loadResultGames();
  const head = `<h2 class="section-title">Our predictions vs what happened</h2>`;
  const words = glossary(["replayed", "live", "lineups", "margin", "miss", "favored", "spread", "total", "closing", "opening", "breakeven", "push", "calib"]);
  if (!SUMS.length) return head + words + `<div class="panel" style="padding:14px 16px"><p style="margin:0">Every prediction is saved. After each game ends,
      our prediction made with <b>confirmed starting lineups</b> is graded here: ✓ right or ✗ wrong, for the winner, the spread and the total.
      Past games are re-predicted every night the same way.</p></div>`;
  const sel = SUMS.find(x => x.name === state.resSel) || SUMS.find(x => /season/.test(x.name)) || SUMS[0];
  const S = sel;
  const inSel = g => S.name === "All time" ? !g.instant : S.name === "Today" ? g.d === todayET() : /^Live/.test(S.name) ? g.src === "live"
    : g.s != null && S.name.startsWith(({2025: "2024-25", 2026: "2025-26", 2027: "2026-27", 2028: "2027-28"})[g.s] || "?");
  const list = G.filter(inSel), shown = state.resShown || 25;
  const rate = r => { const n = r.won + r.lost; return n ? pct(r.won / n, 1) : "–"; };
  const rec = r => `${r.won.toLocaleString()}-${r.lost.toLocaleString()}${r.push ? "-" + r.push : ""}`;
  // plain words instead of "3-3" (owner): "3 won, 3 lost"
  // games being played right now (live scores): they're graded once they finish (owner: "3 games are still live")
  const isToday = S.name === "Today", left = isToday ? gamesLeftToday() : 0;
  const soFar = isToday ? ` so far${left ? ` · ${left} game${left === 1 ? "" : "s"} left today` : ""}` : "";
  const playing = /^Live|season|All time/.test(S.name) ? Object.values(state.live || {}).filter(v => v.state === "in").length : 0;
  const plainRec = r => `${r.won.toLocaleString()} won, ${r.lost.toLocaleString()} lost${r.push ? `, ${r.push} tied (money back)` : ""}`;
  const pct2 = r => { const n = r.won + r.lost; return n ? pct(r.won / n, 1) : "–"; };
  const w = S.winner_right / S.games, bk = S.book_games ? S.book_right / S.book_games : null;
  const cls = bk == null ? "" : w > bk + 0.0005 ? "good" : w < bk - 0.0005 ? "bad" : "";
  const small = S.games < 100 ? `<br>Only ${S.games} game${S.games > 1 ? "s" : ""} so far, so this can still swing a lot.` : "";
  const sw = (S.spread.won + S.spread.lost) ? S.spread.won / (S.spread.won + S.spread.lost) : null;
  const tw = (S.total.won + S.total.lost) ? S.total.won / (S.total.won + S.total.lost) : null;
  const beOk = x => x == null ? "" : x >= 0.524 ? "above" : "below";
  // plain words (owner, 21 Nov): no "−110", no "favourite" jargon
  // owner (21 Nov): "everything needs to be simple" -> two short lines
  const prof = x => x != null && x >= 0.524;
  const verdict = bk == null ? "" : `<div class="verdict-line ${cls}">${cls === "good" ? "✅" : cls === "bad" ? "⚠️" : "⚖️"}
      <b>Picking winners:</b> ${cls === "good" ? "we beat the sportsbook" : cls === "bad" ? "the sportsbook did a bit better" : "tied with the sportsbook"}
      (us ${pct(w, 1)}, sportsbook ${pct(bk, 1)}).${small}</div>`;
  // owner (21 Nov): "beginners don't know what you mean by points" -> plain words + a real game as the example
  const ex = list.find(g => g.ph != null && g.pa != null && g.hs != null), r0 = Math.round;
  // owner (21 Nov): "too much chit chat" -> 3 short lines
  const scoreMiss = `<div class="verdict-line">📏 <b>How close were our scores?</b> Off by about <b>${r0(S.margin_miss)}</b> on the winning margin
      and <b>${r0(S.total_miss)}</b> on total points, per game.${ex ? `<br><span class="muted">e.g. ${esc(ex.h)}–${esc(ex.a)}: we said ${ex.ph}–${ex.pa}, it ended ${ex.hs}–${ex.as}</span>` : ""}</div>`;
  const icon = ok => ok ? `<span class="mark ok">✓</span>` : `<span class="mark no">✗</span>`;
  const tick = res => res === "won" ? "✓" : res === "lost" ? "✗" : res === "push" ? "push" : "";
  // one finished game: score with logos, our predicted score, and a colored chip per bet (green won, red lost, gray push)
  // owner (21 Nov): "wherever there is an X, show the actual outcome" -> why it lost, after the ✗
  const chip = (label, res, why = "") => res ? `<span class="rchip ${res === "won" ? "ok" : res === "lost" ? "no" : "push"}${res === "lost" && why ? " why" : ""}"><span>${label}</span>
      <b>${res === "won" ? "✓" : res === "lost" ? "✗" : "push"}</b>${res === "lost" && why ? `<span class="why">${why}</span>` : ""}</span>` : "";
  const spWhy = g => { const t = String(g.sp).split(" ")[0], m = t === g.h ? g.hs - g.as : g.as - g.hs;
    const n = parseFloat(String(g.sp).split(" ")[1]);
    const need = isNaN(n) ? "" : n < 0 ? `, needed to win by more than ${-n}` : n > 0 ? `, needed to win or lose by less than ${n}` : "";
    return (m > 0 ? `${esc(t)} won by ${m}` : m < 0 ? `${esc(t)} lost by ${-m}` : "tied") + need; };
  const tpWhy = g => { const n = parseFloat(String(g.tp).split(" ")[1]), over = /^Over/i.test(g.tp);
    return `${g.hs + g.as} points scored${isNaN(n) ? "" : `, needed ${over ? "more" : "fewer"} than ${n}`}`; };
  const item = g => {
    const hw = g.hs > g.as;
    return `<li class="rgame ${g.ok ? "rg-ok" : "rg-no"}">
      <div class="rg-top">
        <span class="rg-score">${logo(g.h, 24)}<span class="${hw ? "w" : ""}">${esc(g.h)} ${g.hs}</span><span class="dash">–</span>
          <span class="${hw ? "" : "w"}">${g.as} ${esc(g.a)}</span>${logo(g.a, 24)}</span>
        <span class="rg-meta">${esc(niceDate(g.d))} · <span class="rtag ${g.src === "live" ? "live" : ""}">${g.src === "live" ? (g.lu ? "Live pick" : "Live pick · lineups not confirmed") : "Replayed"}</span></span>
      </div>
      ${g.ev ? `<div style="margin:4px 0 0">${eventBadge(g.ev)}</div>` : ""}
      <div class="rg-pred">Our prediction: <b>${esc(g.h)} ${g.ph}–${g.pa} ${esc(g.a)}</b></div>
      <div class="rg-chips">${chip(`🏆 ${esc(g.pick)} to win (${pct(g.c, 0)})`, g.ok ? "won" : "lost", `${esc(hw ? g.h : g.a)} won`)}${g.sp ? chip(`Spread ${esc(pickName(g.sp))}`, g.spr, spWhy(g)) : ""}${g.tp ? chip(esc(g.tp), g.tr, tpWhy(g)) : ""}</div>
    </li>`;
  };
  const chips = SUMS.map(x => `<button class="subtab ${x.name === S.name ? "on" : ""}" data-ressel="${esc(x.name)}">${esc(x.name.replace(" (since we started tracking)", ""))}
      <span class="count">${x.games.toLocaleString()}</span></button>`).join("");
  const trained = (state.pred || {}).trained_games;
  const learns = `<div class="verdict-line" style="margin-top:0">🧠 Trained on ${trained ? `<b>${Number(trained).toLocaleString()}</b> ` : ""}NBA games
      since Oct 2023 (playoffs included). It keeps learning after every game.</div>`;
  return head + learns + words + `<p class="intro"><b>Live pick</b> = predicted for real, right before tip-off. <b>Replayed</b> = an older game re-tested
      without seeing the result.</p>
    <div class="subtabs" style="grid-template-columns:repeat(auto-fit,minmax(110px,1fr))">${chips}</div>
    ${isToday && !S.games ? `<div class="panel" style="padding:14px 16px;margin-top:12px">No games finished yet today.
      ${left} game${left === 1 ? "" : "s"} left today: each one shows up here the second it ends.</div>` : `
    <div class="stats" style="margin-top:12px">
      <div class="stat"><div class="label">Picked the winner</div><div class="big">${pct(w, 1)}</div>
        <div class="note">${S.winner_right.toLocaleString()} of ${S.games.toLocaleString()} right${soFar}${bk != null ? `<br>Sportsbook's picks: ${pct(bk, 1)} right` : ""}${!isToday && playing ? `<br>${playing} still playing` : ""}</div></div>
      <div class="stat"><div class="label">Spread picks</div><div class="big">${pct2(S.spread)}</div><div class="note">${plainRec(S.spread)}${soFar}.</div></div>
      <div class="stat"><div class="label">Over / under picks</div><div class="big">${pct2(S.total)}</div><div class="note">${plainRec(S.total)}${soFar}.</div></div>
    </div>
    ${scoreMiss}
    ${verdict}`}
    <h2 class="section-title">Every game${state.resGames ? ` (${list.length.toLocaleString()})` : ""}</h2>
    ${state.resGames ? `<div class="panel"><ul class="results-list">${list.slice(0, shown).map(item).join("")}</ul></div>`
      : `<div class="panel" style="padding:14px 16px;color:var(--muted)">Loading every game…</div>`}
    ${list.length > shown ? `<button class="pbtn" data-resmore="1" style="margin-top:10px;width:100%">Show 50 more</button>` : ""}
    ${lineMovesBlock()}
    <h2 class="section-title">Past seasons: more details</h2>`;
}

function accuracyView() {
  const b = state.back;
  if (!b || !b.layers) return resultsBlock() + `<div class="empty">Run <code>python3 backtest.py --save</code> to see this page.</div>`;
  // plain names for the backtest rows (owner, 21 Nov: beginner-friendly, no "opening/closing line", no "-110")
  const nm = n => n.replace(" at the opening line", " · bet early").replace(" at the closing line", " · bet at tip-off")
    .replace("Total picks", "Over / under picks");
  const ln = n => ({"Team ratings only": "Team strength only", "+ injuries (day before)": "+ injury news",
    "+ lineups known": "+ confirmed starting lineups (what we use)", "Sportsbook opening line": "Sportsbook's first number",
    "Sportsbook closing line": "Sportsbook's last number before tip-off"})[n] || n;
  const barsP = (key, floor) => {
    const top = Math.max(...b.layers.map(x => x[key]));
    return b.layers.map(l => `<div class="row"><span>${esc(ln(l.name))}</span><div class="track"><div class="fill ${l.name.includes("line") ? "book" : ""}"
      style="width:${Math.max(4, 100 * (l[key] - floor) / (top - floor))}%"></div></div><span class="num"><b>${l[key].toFixed(2)}</b></span></div>`).join("");
  };
  return resultsBlock() + `<p class="intro">We tested the model on <b>${b.games.toLocaleString()}</b> older games (${esc(b.from)} – ${esc(b.to)}),
    predicting each one using only what was known before it was played.<br>
    <b>Bet early</b> = at the sportsbook's first number for that game. <b>Bet at tip-off</b> = at its last number, right before the game starts.</p>
    <h2 class="section-title">How often our picks won (older games)</h2>
    <div class="stats">${(b.hit_rates || []).map(h => `<div class="stat"><div class="label">${esc(nm(h.name))}</div>
      <div class="big">${pct(h.pct, 1)}</div><div class="note">${h.games.toLocaleString()} games${/favourite/.test(h.note)
        ? " · " + esc(h.note.replace("sportsbook favourite:", "the sportsbook's picks were right")) : ""}</div></div>`).join("")}</div>
    <p class="intro" style="margin-top:8px">The sportsbook's number gets more accurate as game day goes on, so the same pick
      usually does better if you bet it early. That's why "Did the line move our way?" above matters.</p>
    <h2 class="section-title">How close were our predicted scores? (shorter bar = better)</h2>
    <p class="intro">Each bar is how many points we were off per game, on average. Each row gives the model one more piece of information.
      The last two rows are the sportsbook, for comparison.</p>
    <div class="panel bars"><div class="note" style="margin:0 0 6px;color:var(--muted)">How much the winner wins by</div>${barsP("margin", 10)}</div>
    <div class="panel bars" style="margin-top:10px"><div class="note" style="margin:0 0 6px;color:var(--muted)">Both teams' points added together</div>${barsP("total", 13.5)}</div>
    <h2 class="section-title">Can you trust our percentages?</h2>
    <p class="intro">If we say a team has a 75% chance, it should win about 75% of the time. When the two right-hand numbers are close, our percentages are honest.</p>
    <div class="panel"><table class="data"><tr><th>We gave the home team</th><th class="num">Games</th><th class="num">Our average chance</th><th class="num">How often they really won</th></tr>
      ${b.calibration.map(c => `<tr><td>${esc(c.said.replace("%-", "% to "))}</td><td class="num">${c.games}</td><td class="num">${pct(c.avg_said)}</td><td class="num"><b>${pct(c.happened)}</b></td></tr>`).join("")}
    </table></div>
    `;
}

/* ---------- Events ---------- */
$("#main").addEventListener("click", e => {
  const s = e.target.closest("[data-bets]");
  if (s) { state.betsTab = s.dataset.bets; render(); return; }
  const rs = e.target.closest("[data-ressel]");
  if (rs) { state.resSel = rs.dataset.ressel; state.resShown = 25; render(); return; }
  if (e.target.closest("[data-lmmore]")) { state.lmShown = (state.lmShown || 25) + 50; render(); return; }
  if (e.target.closest("[data-resmore]")) { state.resShown = (state.resShown || 25) + 50; render(); return; }
  const pb = e.target.closest("[data-pbook]");
  if (pb) { if (pb.dataset.pbook !== state.parlay.book) { state.parlay.book = pb.dataset.pbook; state.parlay.picks = {}; }
            render(); if (state.parlay.book === "DraftKings") loadDKSlips().then(render); return; }
  const mvb = e.target.closest("[data-mvbook]");
  if (mvb) { state.mvBook = mvb.dataset.mvbook; try { localStorage.setItem("mvBook", state.mvBook); } catch (_) {} render(); return; }
  const pl = e.target.closest("[data-plevel]");
  if (pl) { state.parlay.level = pl.dataset.plevel; render(); return; }
  const pa = e.target.closest("[data-padd]");
  if (pa) { const k = pa.dataset.padd, x = state.pRows[k];
            if (state.parlay.picks[k]) delete state.parlay.picks[k];
            else { const sl = x && slipFor(x, state.parlay.book);
                   if (sl && !parlayConflict(k)) state.parlay.picks[k] = {x, ref: sl.ref, odds: sl.odds}; }
            render(); return; }
  const pd = e.target.closest("[data-pdel]");
  if (pd) { delete state.parlay.picks[pd.dataset.pdel]; render(); return; }
  if (e.target.closest("[data-pclear]")) { e.preventDefault(); state.parlay.picks = {}; render(); return; }
  const d = e.target.closest("[data-day]"); if (!d) return;
  state.day = d.dataset.day; render();
});
$("#tabs").addEventListener("click", e => {
  const t = e.target.closest("[data-tab]"); if (!t) return;
  state.tab = t.dataset.tab; try { localStorage.setItem("tab", state.tab); } catch (_) {}
  render();
});
$("#refresh").addEventListener("click", async () => {
  const btn = $("#refresh"); btn.disabled = true; $("#progress").classList.add("on");
  await fetch("/api/refresh", {method: "POST"});
  const poll = setInterval(async () => {
    const s = await get("/api/refresh");
    if (!s.running) {
      clearInterval(poll); btn.disabled = false; $("#progress").classList.remove("on");
      if (s.error) alert("Refresh failed: " + s.error);
      load();
    }
  }, 2000);
});
try { state.tab = localStorage.getItem("tab") || "games"; } catch (_) {}
if (state.tab === "track") state.tab = "accuracy";
try { state.mvBook = localStorage.getItem("mvBook") || "All"; } catch (_) {}   // Track record + Data merged into one 📊 Results tab (21 Nov)
load();
setTimeout(pollScores, 1500); setInterval(pollScores, 20 * 1000);
setInterval(load, 5 * 60 * 1000);
setInterval(staleCheck, 60 * 1000);
/* Warn when the picks are old: the cloud refreshes them every 15 min by day (hourly 1-6 AM ET). If that stops,
   say so in red instead of quietly showing old lines and old injury news. */
function staleCheck() {
  const p = state.pred || {}, el = document.getElementById("stale");
  if (!el || !p.made_at_iso) return;
  const mins = (Date.now() - new Date(p.made_at_iso).getTime()) / 60000;
  const etHour = Number(new Date().toLocaleString("en-US", {timeZone: "America/New_York", hour: "numeric", hour12: false}));
  const limit = etHour >= 1 && etHour < 6 ? 90 : 30;
  if (mins <= limit) { el.hidden = true; return; }
  const age = mins < 120 ? `${Math.round(mins)} minutes` : `${Math.round(mins / 60)} hours`;
  el.innerHTML = `⚠️ <b>These picks are ${age} old.</b> They normally refresh every 15 minutes, so the updater may be down. Lines and injury news may have changed: don't bet on these numbers until this warning goes away.`;
  el.hidden = false;
}
// Website: browsers keep a copy of the page for up to 10 minutes. Check for a newer version every minute and
// reload by itself, so nobody is stuck looking at an old design (same idea as the first-basket site).
if (window.STATIC_SITE && window.PAGE_VERSION) setInterval(async () => {
  try {
    const v = (await get("version.json?t=" + Date.now())).v;
    if (v && v !== window.PAGE_VERSION) location.replace(location.pathname + "?v=" + v);
  } catch (_) {}
}, 60 * 1000);
setInterval(async () => { if (STATIC || state.tab !== "moves") return; state.moves = await get("/api/moves"); render(); }, 60 * 1000);
</script>
