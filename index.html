/* owner (23 Nov): one box, two numbers (opening line, closing line) */
.split-row { display: grid; grid-template-columns: auto auto 1fr; align-items: baseline; gap: 10px; margin-top: 8px; white-space: nowrap; }
.split-name { font-size: 14px; font-weight: 650; }
.split-pct { font-family: var(--display); font-size: 28px; line-height: 1; } .split-pct.good { color: var(--good); }
.split-rec { color: var(--muted); font-size: 12.5px; text-align: right; overflow: hidden; text-overflow: ellipsis; }
.stat .split-row + .note { margin-top: 10px; }
/* owner (23 Nov, screenshot at ~600 px): two boxes side by side were too narrow for the opening/closing numbers */
.rstats { grid-template-columns: 1fr; }   /* owner 23 Nov: boxes one below the other, never side by side */
/* owner (23 Nov): gray titles on dark gray were hard to read -> "a cool glowing color" (the site's orange, glowing) */
.glow .stat .label { color: #ffa15c; font-weight: 750; font-size: 15px; letter-spacing: .04em;
  text-shadow: 0 0 10px rgba(255, 122, 26, .55), 0 0 2px rgba(255, 122, 26, .35); }   /* Results + Phone alerts (owner 23 Nov: bigger) */
.glow .stat .label { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }   /* owner 23 Nov */
@media (max-width: 400px) { .glow .stat .label { font-size: 12.5px; letter-spacing: .01em; } }
.glow .stat .label + .big { margin-top: 10px; }   /* owner 23 Nov: "Step 1" and "Install Discord" were too close */
.glow .stat .big + .note { margin-top: 8px; line-height: 1.5; }
.calib th, .calib td { white-space: nowrap; }
@media (max-width: 400px) { .calib th, .calib td { padding: 9px 5px; font-size: 13px; } .calib th { font-size: 10px; } }
.wintable { margin-top: 8px; } .wintable td { font-size: 16px; } .wintable td:not(:first-child) { font-family: var(--display); font-size: 22px; }
.wintable + .note { margin-top: 10px; }
.stat .what { color: var(--text); font-size: 13.5px; margin-top: 10px; line-height: 1.4; }
.stat .part { margin-top: 14px; font-weight: 800; font-size: 15px; color: var(--text); }
.stat .part2 { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.stat .part + .what { margin-top: 4px; color: var(--muted); }
.stat .sub-sec { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.stat .part2-label { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); font-weight: 750; font-size: 14px; color: var(--text); }   /* owner 23 Nov: same headers, say what the % means */
.wintable th:nth-child(3), .wintable td:nth-child(3) { border-left: 1px solid var(--line); }
.wintable th:not(:first-child), .wintable td:not(:first-child) { text-align: center; width: 30%; }   /* owner 23 Nov: line looked off */
.wintable td.rec { font-family: inherit; font-size: 15px; color: var(--muted); }
.wintable .cnt { display: block; font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-size: 11.5px; font-weight: 500; color: var(--muted); margin-top: 3px; letter-spacing: 0; }
@media (max-width: 380px) { .wintable td { font-size: 14px; } .wintable td:not(:first-child) { font-size: 19px; } .wintable td.rec { font-size: 12.5px; }
  .wintable .cnt { font-size: 10.5px; } .wintable th, .wintable td { padding-left: 3px; padding-right: 3px; }
  .wintable td:first-child { font-size: 13px; } }   /* owner 23 Nov: line between ours and the book's */
@media (max-width: 430px) { .wintable th .lg { display: none; } .wintable th .sm { display: inline; } }
.wintable th, .wintable td:first-child, .wintable .cnt { white-space: normal; }   /* owner 27 Nov: long labels wrap instead of pushing the box past the phone edge */
@media (max-width: 380px) { .split-row { grid-template-columns: auto 1fr; row-gap: 2px; }
  .split-rec { grid-column: 1 / -1; text-align: left; } }
/* owner (23 Nov): one record per sportsbook, opening line vs closing line */
.bktable { width: 100%; border-collapse: collapse; font-size: 14px; }
.bktable th, .bktable td { padding: 9px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }

@media (max-width: 480px) { .bktable small { display: none; } }
@media (max-width: 380px) { .bktable { font-size: 13px; } .bktable th, .bktable td { padding: 8px 3px; } }
.bktable .sm { display: none; }
@media (max-width: 430px) { .bktable th .lg { display: none; } .bktable th .sm { display: inline; } }
@media (max-width: 620px) { .bktable td .lg { display: none; } .bktable td .sm { display: inline; } }
@media (max-width: 340px) { .bkpanel { padding: 4px 8px !important; } .bktable { font-size: 12.5px; } .bktable th { font-size: 10px; letter-spacing: .02em; }
  .bktable td.sub { padding-left: 10px; } .bktable .lg { display: none; } .bktable .sm { display: inline; } }
.bars { padding: 6px 18px; }

.bars .track { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bars .fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent-hi), var(--accent-deep)); animation: grow .8s cubic-bezier(.2,.7,.2,1) both; }

@media (max-width: 560px) { .bars .row { grid-template-columns: 1fr 64px; } .bars .row .track { grid-column: 1 / -1; grid-row: 2; } }

/* ── Line moves ── */

}

   quiet pill labels, the predicted score as a dark band of big numbers, cards slide in + numbers count up once ══ */

  box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.25); }

/* ══ REDESIGN 27 Nov: "cook up" pass (27 Nov): hero + live stat band + matchup strip + aurora + card spotlight ══ */
html[data-layout="new"] body::before, html[data-layout="new"] body::after { content: ""; position: fixed; z-index: -1; pointer-events: none;
  width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .22; }
html[data-layout="new"] body::before { background: var(--accent); top: -30vmax; left: -20vmax; animation: aur1 22s ease-in-out infinite alternate; }
html[data-layout="new"] body::after { background: #3b82f6; bottom: -35vmax; right: -25vmax; opacity: .14; animation: aur2 26s ease-in-out infinite alternate; }
@keyframes aur1 { to { transform: translate(18vmax, 10vmax) scale(1.15); } }
@keyframes aur2 { to { transform: translate(-14vmax, -12vmax) scale(1.1); } }

  border: 1px solid rgba(255,255,255,.08); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.hx::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;

  background-size: 44px 44px; -webkit-mask-image: radial-gradient(80% 70% at 70% 0%, #000, transparent 75%); mask-image: radial-gradient(80% 70% at 70% 0%, #000, transparent 75%); }
.hx > * { position: relative; }

  box-shadow: 0 0 40px rgba(248,113,113,.08); }
.lsb-h { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 10px 2px 8px; }
.lsb-h b { font-family: var(--display); font-size: 21px; letter-spacing: .03em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; }
.lsb-h .tally { font-size: 13px; font-weight: 700; color: var(--text); }
.lsb-row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; width: 100%; padding: 10px 2px; border: 0;
  border-top: 1px solid rgba(255,255,255,.06); background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.lsb-st { font-size: 11px; font-weight: 800; letter-spacing: .05em; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.lsb-st.in { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; }
.lsb-st.post { background: rgba(255,255,255,.08); }
.lsb-sc { font-family: var(--display); font-size: 19px; letter-spacing: .02em; white-space: nowrap; }
.lsb-sc .lead { color: var(--text); } .lsb-sc .trail { opacity: .55; }
.lsb-pk { grid-column: 2 / -1; font-size: 12.5px; }
.lsb-res { font-size: 12.5px; font-weight: 800; white-space: nowrap; }
.lsb-res.win { color: var(--good); } .lsb-res.lose { color: var(--bad); } .lsb-res.tie { color: var(--text); opacity: .8; }
@media (max-width: 420px) { .lsb { padding: 4px 12px 8px; } .lsb-sc { font-size: 17px; } }
.lsb-pk { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.lsb-pk .pc { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.06); white-space: nowrap; }
.lsb-pk .pc.win { background: var(--good-soft); color: var(--good); } .lsb-pk .pc.lose { background: var(--bad-soft); color: var(--bad); }
.lsb-pk .pc em { font-style: normal; opacity: .75; font-weight: 600; }
/* ══ REDESIGN 27 Nov: animation pack (27 Nov) #1 strong picks glow: slow rotating orange edge on 70%+ picks ══ */
html[data-layout="new"] #main .card.strong { border: 1px solid transparent;
  background: radial-gradient(75% 45% at 0% 0%, color-mix(in srgb, var(--away-c) 24%, transparent), transparent 72%) padding-box,
              radial-gradient(75% 45% at 100% 0%, color-mix(in srgb, var(--home-c) 24%, transparent), transparent 72%) padding-box,
              linear-gradient(var(--surface), var(--surface)) padding-box,
              conic-gradient(from var(--hxang), rgba(255,255,255,.07) 0deg, var(--accent-hi) 50deg, #ffd2a6 70deg, var(--accent-hi) 90deg, rgba(255,255,255,.07) 140deg, rgba(255,255,255,.07) 360deg) border-box;
  animation: hxspin 6s linear infinite; }
@media (prefers-reduced-motion: reduce) { html[data-layout="new"] #main .card.strong { animation: none; } }
/* #2 scoreboard digits roll in when a live score changes (cards + live scoreboard) */
html[data-layout="new"] .live-score .bump, .lsb-sc .roll { display: inline-block; animation: digroll .7s cubic-bezier(.2,.9,.25,1.25) both; }
@keyframes digroll { 0% { transform: translateY(-90%) rotateX(80deg); opacity: 0; filter: blur(3px); color: #fde047; }
  60% { color: #fde047; } 100% { transform: none; opacity: 1; filter: none; } }
@media (prefers-reduced-motion: reduce) { html[data-layout="new"] .live-score .bump, .lsb-sc .roll { animation: none; } }
/* #3 win burst: a green ring pulses out once when a pick flips to ✅ */
.lsb-pk .pc.burst { position: relative; animation: burstpop .6s cubic-bezier(.2,.9,.3,1.4); }
.lsb-pk .pc.burst::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; animation: burstring 1.1s ease-out forwards; }
@keyframes burstpop { 40% { transform: scale(1.18); } }
@keyframes burstring { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.75); } 100% { box-shadow: 0 0 0 16px rgba(74,222,128,0); } }
@media (prefers-reduced-motion: reduce) { .lsb-pk .pc.burst, .lsb-pk .pc.burst::after { animation: none; } }
/* #4 directional tab slides */
html[data-layout="new"] #main.swap-r { animation: swapR .45s cubic-bezier(.2,.8,.2,1); }
html[data-layout="new"] #main.swap-l { animation: swapL .45s cubic-bezier(.2,.8,.2,1); }
@keyframes swapR { from { opacity: 0; transform: translateX(46px); } }
@keyframes swapL { from { opacity: 0; transform: translateX(-46px); } }
@media (prefers-reduced-motion: reduce) { html[data-layout="new"] #main.swap-r, html[data-layout="new"] #main.swap-l { animation: none; } }
/* #5 metallic shine: a thin light sweeps across the big hero numbers every few seconds (keeps each number's own colour) */
.hx-st b, .hx-tile b { --c: var(--text);
  background: linear-gradient(100deg, var(--c) 0 42%, #ffffff 48%, #fff7ed 50%, var(--c) 58% 100%) 0 0 / 280% 100% no-repeat;
  -webkit-background-clip: text; background-clip: text; color: transparent !important; animation: metal 5.5s ease-in-out infinite; }
.hx-st b.hot, .hx-tile.on b { --c: var(--accent-hi); }
.hx-st b.bad { --c: var(--bad); } .hx-st b.warn2 { --c: var(--warn); } .hx-st b.good2 { --c: var(--good); }
.hx-st:nth-child(2) b, .hx-tile:nth-child(2) b { animation-delay: .5s; } .hx-st:nth-child(3) b, .hx-tile:nth-child(3) b { animation-delay: 1s; }
.hx-st:nth-child(4) b, .hx-tile:nth-child(4) b { animation-delay: 1.5s; }
@keyframes metal { 0%, 55% { background-position: 100% 0; } 85%, 100% { background-position: 0% 0; } }
@media (prefers-reduced-motion: reduce) { .hx-st b, .hx-tile b { animation: none; } }
/* #6 value bet heartbeat: the 💰 tile beats softly every few seconds */
.tvb-ic { animation: vbeat 3.2s ease-in-out infinite; }
@keyframes vbeat { 0%, 70%, 100% { transform: scale(1); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--good) 40%, transparent); }
  76% { transform: scale(1.12); box-shadow: inset 0 0 0 1px var(--good), 0 0 18px color-mix(in srgb, var(--good) 55%, transparent); }
  82% { transform: scale(.97); } 88% { transform: scale(1.07); } }
@media (prefers-reduced-motion: reduce) { .tvb-ic { animation: none; } }
.lsb-src { width: 100%; font-size: 12px; color: var(--text); opacity: .7; }
.lsb-h .lsb-src b { font-weight: 700; font-family: inherit; font-size: inherit; letter-spacing: 0; text-transform: none; }
/* ══ REDESIGN 27 Nov: game tracker under the live scoreboard (27 Nov) ══ */
.trk-btn { margin-left: auto; padding: 4px 10px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 750; cursor: pointer; color: var(--text);

.trk-line { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; margin-bottom: 10px; }
.trk-line th { font-size: 11px; font-weight: 700; opacity: .7; padding: 2px 4px; text-align: center; }

  MIA:"Heat",MIL:"Bucks",MIN:"Timberwolves",NO:"Pelicans",NY:"Knicks",OKC:"Thunder",ORL:"Magic",PHI:"76ers",PHX:"Suns",
  POR:"Trail Blazers",SAC:"Kings",SA:"Spurs",TOR:"Raptors",UTAH:"Jazz",WSH:"Wizards"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const niceDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || "")); if (!m) return String(s || "");
  return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric"}); };
const MINUS = "\u2212";   // a real minus sign: the plain hyphen looks spaced out in this font

const pct = (x, d = 1) => x == null ? "–" : (Math.abs(100 * x) < 1 && x !== 0 ? (100 * x).toFixed(Math.max(2, d)) : (100 * x).toFixed(Math.max(1, d))) + "%";
const aPct = (x, d = 1) => { const t = pct(x, d); return (/^(8|11|18)/.test(t) ? "an " : "a ") + t; };

/* ---------- Website mode: everything arrives encrypted; your password unlocks it ---------- */
const STATIC = !!window.STATIC_SITE;
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...b));
let dataKey = null;
async function unwrapKey(entry, password) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: b64d(entry.salt), iterations: entry.iter},
                                            base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64d(entry.iv)}, kek, b64d(entry.wk)));
}
async function decryptData(raw, file = "data.json") {
  const e = await get(file + "?t=" + Date.now());
  const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64d(e.iv)}, k, b64d(e.ct))));
}
function savedKey() {
  try { const s = JSON.parse(localStorage.getItem("nbaModelKey") || "null");
        return s && s.until > Date.now() ? b64d(s.k) : null; } catch (_) { return null; }
}

// owner (27 Nov): G League players marked Out (two-way / on assignment) aren't with the team, so they're hidden from
// the injury lists, the game cards and the counts. G League players who are Questionable stay (they may be called up).
// Display only: the model already gives them 0% to play.
function hideGLeagueOut(p) {
  if (!p) return p;
  const gl = r => /^G\s?League/i.test(String((r || {}).detail || "")) && String(r.status || "").toLowerCase() === "out";
  const hidden = new Set();
  for (const [t, rows] of Object.entries(p.injuries || {}))
    if (Array.isArray(rows)) { rows.filter(gl).forEach(r => hidden.add(t + "|" + r.name)); p.injuries[t] = rows.filter(r => !gl(r)); }
  for (const g of p.games || []) for (const s of ["home", "away"]) {
    if (g.inj && Array.isArray(g.inj[s])) { g.inj[s].filter(gl).forEach(r => hidden.add(g[s] + "|" + r.name)); g.inj[s] = g.inj[s].filter(r => !gl(r)); }
    if (g.out && Array.isArray(g.out[s])) g.out[s] = g.out[s].filter(r => !hidden.has(g[s] + "|" + r.name));
  }
  return p;
}
async function fetchAll() {
  if (!STATIC) { const r = await Promise.all([get("/api/predictions"), get("/api/tracker"), get("/api/backtest"), get("/api/moves")]);
    hideGLeagueOut(r[0]); return r; }
  const b = await decryptData(dataKey);
  return [hideGLeagueOut(b.predictions), b.tracker, b.backtest, b.moves];
}

async function load() {
  // Discord's DraftKings button for an alternate line opens <site>#dk=<pick>: remember it (it survives signing in),
  // then once the data is in, look the line up in DraftKings' own feed and go straight to its betslip.
  if (/^#dk=/.test(location.hash)) {
    try { localStorage.setItem("dkJump", decodeURIComponent(location.hash.slice(4))); } catch (_) {}
    history.replaceState(null, "", location.pathname);
  }
  if (STATIC && signinTicket()) return finishDiscordSignin();
  if (STATIC && /^#signin-error=/.test(location.hash)) {
    const why = location.hash.split("=")[1];
    history.replaceState(null, "", location.pathname);
    return showLogin(SIGNIN_ERRORS[why] || SIGNIN_ERRORS.failed);
  }
  if (STATIC && !dataKey) { dataKey = savedKey(); if (!dataKey) return showLogin(); recheckMember(); }
  try {
    [state.pred, state.track, state.back, state.moves] = await fetchAll();
  } catch (e) {
    if (STATIC) { dataKey = null; try { localStorage.removeItem("nbaModelKey"); } catch (_) {} return showLogin("Please sign in again."); }
    throw e;
  }
  showAccount();
  const p = state.pred || {};
  $("#stamp").textContent = p.made_at ? "Updated " + p.made_at : "No predictions yet";
  staleCheck();
  const games = (p.games || []).length, bets = (p.bets || []).length, m = state.moves || {};
  $("#ticker").innerHTML = [
    gamesPill(p),
    ...hitPills(),
    injuryPill(p),
    `<span class="pill"><span class="livedot"></span>Odds checked ${m.checked ? "at <b>" + esc(m.checked) + "</b>" : "every few minutes"}</span>`,
  ].join("");
  render();
  jumpToDK();
}

// owner (27 Nov): on iPhone/iPad the sportsbook buttons open the APP directly. Safari's normal web links stop opening
// the app in a Private tab, or after one "Cancel"; these app links don't. Tested on his iPhone (applink_test.html):
// DraftKings dksb://sb/addbet/ID1+ID2 and FanDuel fanduelsportsbook://sportsbook.fanduel.com/addToBetslip?... both fill
// the slip, parlays included. If the app doesn't open within 3 s (not installed), the normal web link opens instead.
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function appLink(url) {
  let m = /^https:\/\/sportsbook\.draftkings\.com\/\?outcomes=(.+)$/.exec(url);
  if (m) return "dksb://sb/addbet/" + m[1];
  m = /^https:\/\/sportsbook\.fanduel\.com\/addToBetslip\?(.+)$/.exec(url);
  if (m) return "fanduelsportsbook://sportsbook.fanduel.com/addToBetslip?" + m[1];
  return null;
}
function openBook(url) {
  const app = IOS && appLink(url);
  if (!app) { location.href = url; return; }
  let left = false; const gone = () => { left = true; };
  document.addEventListener("visibilitychange", gone, {once: true});
  window.addEventListener("pagehide", gone, {once: true});
  window.addEventListener("blur", gone, {once: true});
  location.href = app;
  setTimeout(() => { if (!left && !document.hidden) location.href = url; }, 3000);
}
document.addEventListener("click", e => {
  if (!IOS || e.defaultPrevented) return;
  const a = e.target.closest && e.target.closest("a[href]");
  if (!a || !appLink(a.href)) return;
  e.preventDefault();
  openBook(a.href);
}, true);
async function jumpToDK() {
  let key = null;
  try { key = localStorage.getItem("dkJump"); localStorage.removeItem("dkJump"); } catch (_) {}
  if (!key) return;
  await loadDKSlips();
  // one bet, or a whole parlay ("key1,key2,..."): every leg must be found, then one DraftKings betslip with all of them
  const keys = key.split(","), found = keys.map(k => (state.dkSlip || {})[k]);
  if (found.every(Boolean)) {
    openBook("https://sportsbook.draftkings.com/?outcomes=" + found.map(d => String(d.id).replace(/#/g, "%23")).join("+"));
    return;
  }
  // owner (21 Nov): Discord's in-app browser blocks alert() pop-ups, so people just landed on the site with no reason.
  // Show the reason at the top of the page instead.
  const legName = k => { const [g, mk, side, line] = k.split("|"), [aw, hm] = g.split("@"), team = side === "home" ? hm : aw;
    const who = `${TEAMS[aw] || aw} vs ${TEAMS[hm] || hm}`;
    const bet = mk === "moneyline" ? `${team} to win` : mk === "spread" ? `${team} ${sp(Number(line))}` : `${side === "over" ? "Over" : "Under"} ${line}`;
    return `<b>${esc(bet)}</b> (${esc(who)})`; };
  const missing = keys.filter((k, i) => !found[i]).map(legName).join(", ");
  state.dkMissing = `⚠️ DraftKings doesn't have this exact ${keys.length > 1 ? "parlay" : "bet"} right now. Missing: ${missing}.
    DraftKings has a different line or hasn't posted it yet. Use the <b>FanDuel</b> button instead, or try again later.`;
  render();
  window.scrollTo(0, 0);
}

/* ---------- Sign in with Discord (relay checks you're in the NBA Model server, live) ---------- */
const signinTicket = () => (/^#signin=([A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)$/.exec(location.hash) || [])[1] || "";
const SIGNIN_ERRORS = {
  notmember: "That Discord account isn't a member of Solomon's NBA Model on Discord. Ask the owner for an invite, then try again.",
  cancelled: "Discord sign-in was cancelled. Tap \"Sign in with Discord\" to try again.",
  expired: "That took too long. Tap \"Sign in with Discord\" to try again.",
  failed: "Discord sign-in didn't work. Tap \"Sign in with Discord\" to try again.",
  revoked: "You're no longer a member of Solomon's NBA Model on Discord, so you've been signed out."};
function signOut(msg) {
  try { ["nbaModelKey", "nbaModelUser", "nbaModelSession"].forEach(k => localStorage.removeItem(k)); } catch (_) {}
  dataKey = null; $("#acct").hidden = true; if ($("#nxAcct")) $("#nxAcct").hidden = true; showLogin(msg);
}
async function finishDiscordSignin() {
  const ticket = signinTicket();
  history.replaceState(null, "", location.pathname);
  showLogin("Signing you in…");
  const r = await fetch(window.RELAY_URL + "/key", {method: "POST", headers: {"Content-Type": "application/json"},
                                                    body: JSON.stringify({ticket})});
  const j = r.ok ? await r.json() : {};
  if (!j.ok) return showLogin(SIGNIN_ERRORS.expired);
  dataKey = b64d(j.key);

    localStorage.setItem("nbaModelUser", j.name || "");

async function recheckMember() {
  // every time the page opens: still in the Discord server? If not, sign out (left or kicked)
  let session = ""; try { session = localStorage.getItem("nbaModelSession") || ""; } catch (_) {}
  if (!session || !window.RELAY_URL) return;          // password (owner) logins have no Discord session
  try {
    const r = await fetch(window.RELAY_URL + "/session", {method: "POST", headers: {"Content-Type": "application/json"},
                                                          body: JSON.stringify({session})});
    if (r.ok && !(await r.json()).ok) signOut(SIGNIN_ERRORS.revoked);
  } catch (_) { /* offline: try again next time */ }
}

// owner (21 Nov): say which day the numbers are for ("6 games today · 7 tomorrow", "Injury report: 110 players tomorrow")
function dayWord(d) {
  const t = todayET(), tm = new Date(Date.parse(t + "T12:00:00") + 864e5).toISOString().slice(0, 10);
  return d === t ? "today" : d === tm ? "tomorrow" : niceDate(d);
}
function gamesPill(p) {
  const by = {}; for (const g of p.games || []) by[g.date] = (by[g.date] || 0) + 1;
  return `<span class="pill">${Object.keys(by).sort().map(d => `<b>${by[d]}</b> game${by[d] === 1 ? "" : "s"} ${dayWord(d)}`).join(" · ") || "No games"}</span>`;
}
function injuryPill(p) {
  // every day on the site, today included (owner 21 Nov); each game's own list (frozen before tip-off)
  const by = {};
  for (const g of p.games || []) {
    const names = by[g.date] = by[g.date] || new Set();
    for (const side of ["home", "away"]) for (const r of ((g.inj || {})[side] || [])) names.add(g[side] + "|" + r.name);
  }
  const days = Object.keys(by).sort();
  return `<span class="pill">Injury report: ${days.map(d => `<b>${by[d].size}</b> player${by[d].size === 1 ? "" : "s"} ${dayWord(d)}`).join(" · ") || "no games"}</span>`;
}
function hitPills() {
  const hr = (state.back && state.back.hit_rates) || [];
  // owner (22 Nov): the banner shows the SAME all-time number as the Results tab (real picks since we went live +
  // re-tested games before that); the backtest's own figure is only a fallback
  const all = (((state.track || {}).results || {}).summaries || []).find(x => x.name === "All time");
  const w = all && all.games ? {pct: all.winner_right / all.games} : hr.find(h => h.name === "Picked the winner");
  const out = [];
  if (w) out.push(`<span class="pill">🎯 Picked the winner in <b>${pct(w.pct, 1)}</b> of games all time</span>`);
  out.push(`<span class="pill" id="todayPill">${todayPillText()}</span>`);
  return out;
}
// owner (21 Nov): the banner shows TODAY's winners (updates the moment a game ends, like the Results "Today" button)
function todayPillText() {
  const T = withInstant(((state.track || {}).results || {}).summaries || [], instantGames()).find(x => x.name === "Today");
  return T && T.games ? `🎯 Winners we got right today: <b>${T.winner_right} of ${T.games}</b> so far` : "🎯 Today: no games finished yet";
}

// On phones each table row becomes its own small card, so every cell needs its column name next to it.
function labelTables() {
  document.querySelectorAll("#main table.data").forEach(t => {
    const rows = [...t.rows]; if (!rows.length) return;
    const names = [...rows[0].cells].map(c => c.textContent.trim());

/* ---------- DraftKings live, read straight from this browser (DraftKings lets websites do this) ---------- */
const DK_NBA = "42648", DK_SUB = "4511";

  + `?isBatchable=false&templateVars=${DK_NBA}`
  + "&eventsQuery=" + encodeURIComponent(`$filter=leagueId eq '${DK_NBA}' AND clientMetadata/Subcategories/any(s: s/Id eq '${DK_SUB}')`)
  + "&marketsQuery=" + encodeURIComponent(`$filter=clientMetadata/subCategoryId eq '${DK_SUB}' AND tags/all(t: t ne 'SportcastBetBuilder')`)
  + "&include=Events&entity=events";
const NICK = {hawks:"ATL",celtics:"BOS",nets:"BKN",hornets:"CHA",bulls:"CHI",cavaliers:"CLE",mavericks:"DAL",nuggets:"DEN",
  pistons:"DET",warriors:"GS",rockets:"HOU",pacers:"IND",clippers:"LAC",lakers:"LAL",grizzlies:"MEM",heat:"MIA",bucks:"MIL",
  timberwolves:"MIN",pelicans:"NO",knicks:"NY",thunder:"OKC",magic:"ORL","76ers":"PHI",suns:"PHX","trail blazers":"POR",
  blazers:"POR",kings:"SAC",spurs:"SA",raptors:"TOR",jazz:"UTAH",wizards:"WSH"};
const nickCode = n => { n = String(n || "").toLowerCase();
  return Object.keys(NICK).sort((a, b) => b.length - a.length).map(k => n.endsWith(k) ? NICK[k] : "").find(Boolean) || ""; };
const dkNum = s => s == null ? null : Number(String(s).replace("−", "-").replace("+", ""));
function parseDK(d) {
  const games = {}, kind = {};
  for (const e of d.events || []) {
    if (e.status && e.status !== "NOT_STARTED") continue;
    const side = {}; for (const p of e.participants || []) side[p.venueRole] = nickCode(p.name);
    if (side.Home && side.Away) games[e.id] = {key: `${side.Away}@${side.Home}`};
  }
  for (const m of d.markets || []) kind[m.id] = [String(m.eventId), (m.marketType || {}).name || m.name];
  for (const s of d.selections || []) {
    const [ev, mt] = kind[s.marketId] || []; const g = games[ev]; if (!g) continue;
    const o = dkNum((s.displayOdds || {}).american), main = (s.tags || []).includes("MainPointLine"), t = s.outcomeType;
    if (mt === "Moneyline" && (t === "Home" || t === "Away")) g[t.toLowerCase() + "_ml_close"] = o;
    else if (mt === "Spread" && main && (t === "Home" || t === "Away")) { g[t.toLowerCase() + "_spread_odds_close"] = o; if (t === "Home") g.spread_close = s.points; }
    else if (mt === "Total" && main && (t === "Over" || t === "Under")) { g[t.toLowerCase() + "_odds_close"] = o; g.total_close = s.points; }
  }
  return Object.fromEntries(Object.values(games).map(g => [g.key, g]));
}
const DK_KEYS = [["spread_close", "Spread", "spread"], ["total_close", "Total", "total"], ["away_ml_close", "Away ML", "away_ml"],
  ["home_ml_close", "Home ML", "home_ml"], ["home_spread_odds_close", "Home spread price", "home_spread_odds"],
  ["away_spread_odds_close", "Away spread price", "away_spread_odds"], ["over_odds_close", "Over price", "over_odds"],
  ["under_odds_close", "Under price", "under_odds"]];
state.dkLive = {}; state.dkSeen = {}; state.dkAt = null; state.dkOk = null;
async function pollDK() {
  try {
    const r = await fetch(DK_URL, {cache: "no-store"}); if (!r.ok) throw new Error(r.status);

    const wk = await crypto.subtle.sign("HMAC", base, enc.encode("nba-model-relay-write"));

const GLOSSARY = {
  odds: ["Odds (the price)", "How much a bet pays. <b>−150</b> means you bet $150 to win $100. <b>+150</b> means you bet $100 to win $150. A minus sign = the favourite (pays less), a plus sign = the underdog (pays more). When you win you also get your bet back."],
  moneyline: ["Moneyline (ML)", "A bet on who wins the game, nothing else. \"ATL ML −237\" = bet $237 on the Hawks to win $100 if they win."],
  spread: ["Spread", "A head start in points that makes the game even. <b>ATL −6.5</b> = the Hawks must win by 7 or more. <b>CHA +6.5</b> = the Hornets win the bet if they win, or lose by 6 or less. Spreads on this site are written for the home team unless the team is named."],
  total: ["Total (Over / Under)", "A bet on both teams' points added together. <b>Over 218.5</b> wins if they score 219 or more combined; <b>Under 218.5</b> wins at 218 or less."],
  push: ["Push", "A tie with the line (for example a 7-point win on a −7 spread). Your bet is returned: no win, no loss. A .5 line (−6.5) can never push."],
  favored: ["Favourite / underdog", "The <b>favourite</b> is the team expected to win (minus odds, minus spread). The <b>underdog</b> is expected to lose (plus odds, plus spread)."],
  predscore: ["Predicted score", "What our model thinks the final score will be. Games rarely land exactly on it — it's the middle of what usually happens."],
  winchance: ["Chance to win", "How often we think a team wins this game. 76% means: in 100 games like this one, it wins about 76 and loses about 24. Next to it are DraftKings' and FanDuel's chances, worked out from their odds (with their built-in profit taken out)."],
  fair: ["Fair odds", "The odds that would match our chance exactly, with no sportsbook profit built in. If a sportsbook pays <i>more</i> than our fair odds, that bet is good value."],
  weexpect: ["We expect …%", "Our chance that this bet wins. It mixes our model with the sportsbook's own line (25% our model for spreads, 40% for totals), which tested more accurate than either alone. In the last 6 hours before tip-off our model's share shrinks toward zero, because by then the sportsbook's line is very sharp."],
  bookexpects: ["DraftKings / FanDuel expects …%", "The chance the sportsbook's odds imply. At −110 it's 52.4%: the bet has to win that often just to break even."],
  edge: ["Edge", "Our chance minus the chance the odds need, in percentage points. 58% vs 52% = a 6-point edge. Bigger is better. We only show bets with an edge of 4+ points, because smaller edges lost money in past seasons."],
  value: ["Value bet 💰", "A bet where we think the team wins more often than the odds say — our chance is at least 4 percentage points higher than what the odds need (58% vs 52% = 6 points). Not a sure thing: it means the price is good, so over many such bets you should come out ahead."],
  breakeven: ["Break-even (needs to hit)", "How often a bet at these odds must win for you to neither win nor lose money over many bets. −110 = 52.4%, +100 = 50%, +200 = 33.3%."],
  alt: ["Alternate lines (bigger payouts)", "The same bet at a different number. Instead of ATL −6.5 at −110, you can take ATL −10.5 at +150 (pays more, wins less often) or ATL −2.5 at −200 (pays less, wins more often)."],
  safest: ["Safest picks 🔒", "Bets we give a 70%+ chance to win at a fair price. They win often but pay little (−300 = bet $300 to win $100), so one loss can wipe out several wins."],
  ours: ["Our prediction 🔮", "Our pick for every game: the team we think <b>wins</b>, a <b>spread</b> and a <b>total</b>. The line is our number with the decimal dropped, then the .5 just below (we say Hawks by 8.7 → Hawks −7.5; 218.4 points → Over 217.5), or the Under just above our number when the sportsbook's total is higher than ours. It's our prediction, not a value bet: check the % — some are close to a coin flip."],
  favorable: ["Favorable 👍", "Any pick where our chance to win is higher than the sportsbook's price needs (even by 1 point). Weaker than a <b>value bet</b> (4+ points): small edges like these didn't make money on their own in past seasons, so treat them as parlay fillers, not sure things."],
  parlay: ["Parlay", "Several bets combined into one. It pays much more, but EVERY pick must win — one wrong pick loses the whole bet. Its chance is each pick's chance multiplied together (three 70% picks ≈ 34%)."],
  sgp: ["Same Game Parlay", "A parlay with two or more picks from the same game. Sportsbooks price these themselves (the picks affect each other), so the odds can differ from a normal parlay. A team's moneyline and its spread can't be combined at all."],
  opening: ["Opening line", "The first number a sportsbook posts for a game, usually the day before. It's the easiest one to beat — the book hasn't heard all the news yet."],
  closing: ["Closing line", "The last number before tip-off. By then all the news is out and big bettors have moved it, so it's the sharpest number there is. Beating it over time is the best sign of a good bettor."],
  move: ["Line move 📈", "When a sportsbook changes its number or odds (injury news, lots of money on one side). 📈 moving our way = the book is moving toward our number (good, bet early). ⏰ hasn't moved yet = still at the old number. ⚠️ moving against us = warning. ↔️ moved past our number = the value is gone."],
  betsoon: ["⏰ Bet soon", "The line hasn't caught up with our number yet. In past games, lines usually moved our way later, so the current price is likely the best one."],
  lineups: ["Starting lineups: expected / confirmed", "Who starts the game. <b>Expected</b> = a best guess (early in the day). <b>Confirmed</b> = official, about 30 minutes before tip-off. Our picks get more accurate once lineups are confirmed."],
  neutral: ["📍 Neutral court", "Neither team is at home (for example NBA Cup games in Las Vegas), so neither gets home-court advantage."],
  h2h: ["Head to head", "How these two teams did against each other in past meetings. Shown for interest only — it didn't improve predictions in our tests."],
  injstatus: ["Injury statuses", "<b>Out</b> = won't play. <b>Doubtful</b> = very unlikely to play (1–6%). <b>Questionable / game-time decision</b> = could go either way (34–60% depending on role). <b>Probable</b> = very likely to play (about 93–97% for starters). <b>Minutes restriction</b> = plays, but fewer minutes than usual."],
  linevalue: ["Line value (beat the close)", "How many points the line moved toward our pick between when we made it and tip-off. Positive = we got a better number than the final line — the clearest early sign the picks are good, long before wins and losses settle."],
  record: ["Record (W-L-P)", "Wins – losses – pushes. 12-8-1 = 12 won, 8 lost, 1 push."],
  hit: ["Hit %", "How often the picks won, pushes left out. For spreads and totals at −110 you need 52.4% to make money."],
  margin: ["Margin", "How many points the home team won (or lost) by. Hawks 118, Hornets 104 = a margin of +14 for the Hawks."],
  miss: ["Average miss", "How far our predicted score was from the real one, on average, in points. Lower is better. Even the sportsbooks miss by about 11 points on the margin — basketball is random."],
  calib: ["\"When it says X%, does it happen X%?\"", "A honesty check on our chances: of all the games where we said a team had about 65%, did it really win about 65% of them? If yes, our percentages can be trusted."],
  replayed: ["Replayed games", "Past games re-predicted the fair way: each one using only games played before it (never its own result), like predicting it on the day."],
  live: ["Live games", "Games graded on the prediction we actually made right before tip-off (from 20 Nov 2026 on)."],
  betslip: ["Betslip", "The list of bets you're about to place in the DraftKings or FanDuel app. Our links put the bet there for you — nothing is placed until you confirm in the app."],

// For each game today / tomorrow: our spread pick and our Over/Under pick, and which app (FanDuel or DraftKings)
// has the better line for it. Better line = fewer points to give (or more points of cushion); same line at both
// apps -> the one that pays more. Lines: the odds tracker's latest reading, else the prediction's copy.
function bestLines(pred) {
  const games = ((pred && pred.games) || []).filter(onListDay);
  const out = [];
  for (const g of games) {
    const tg = movesGame(g) || {};
    const started = !!(g.started || tg.started || Date.parse(String(g.start_utc).replace(" ", "T")) <= Date.now());
    if (started) continue;
    const now = (name, fb) => { const n = ((tg.books || []).find(b => b.book === name) || {}).now;
      if (n) return n; const f = fb || {}, o = {};
      for (const [k, v] of Object.entries(f)) o[k.replace(/_close$/, "")] = v; return o; };
    const B = {DraftKings: now("DraftKings", g.dk), FanDuel: now("FanDuel", g.fd)};
    // DraftKings' own main line read in this browser beats our saved copy (it's the newest; links match it too)
    const dm = state.dkMain || {}, key = `${g.away}@${g.home}`, m = s => dm[`${key}|${s}`];
    if (m("spread|home") && m("spread|away")) Object.assign(B.DraftKings = {...B.DraftKings}, {spread: m("spread|home").line,
      home_spread_odds: m("spread|home").odds, away_spread_odds: m("spread|away").odds});
    if (m("total|over") && m("total|under")) Object.assign(B.DraftKings = {...B.DraftKings}, {total: m("total|over").line,
      over_odds: m("total|over").odds, under_odds: m("total|under").odds});
    if (m("moneyline|home") && m("moneyline|away")) Object.assign(B.DraftKings = {...B.DraftKings}, {home_ml: m("moneyline|home").odds,
      away_ml: m("moneyline|away").odds});
    const pick = (lineOf, oddsOf, better) => {        // -> {pick, best, other} or null
      const have = Object.entries(B).filter(([, b]) => lineOf(b) != null && oddsOf(b) != null);
      if (!have.length) return null;
      const rows = have.map(([name, b]) => ({name, line: lineOf(b), odds: oddsOf(b)}));
      rows.sort((a, b) => better(b.line, a.line) || toDec(b.odds) - toDec(a.odds));
      const [x, y] = rows;
      const same = y && x.line === y.line && x.odds === y.odds, sameLine = y && x.line === y.line;
      return {best: x, other: y || null, same, sameLine};
    };
    const hs = [B.DraftKings.spread, B.FanDuel.spread].filter(v => v != null);
    let spread = null, total = null;
    if (hs.length && g.pred_margin != null) {
      const avg = hs.reduce((a, b) => a + b, 0) / hs.length, edge = g.pred_margin + avg;
      if (Math.abs(edge) > 1e-9) {
        const home = edge > 0, team = home ? g.home : g.away;
        const r = pick(b => b.spread == null ? null : home ? b.spread : -b.spread,
                       b => home ? b.home_spread_odds : b.away_spread_odds, (a, b) => a - b);
        if (r) spread = {...r, label: l => `${team} ${sp(l)}`};
      }
    }
    const ts = [B.DraftKings.total, B.FanDuel.total].filter(v => v != null);
    if (ts.length && g.pred_total != null) {
      const avg = ts.reduce((a, b) => a + b, 0) / ts.length;
      if (Math.abs(g.pred_total - avg) > 1e-9) {
        const over = g.pred_total > avg;
        const r = pick(b => b.total, b => over ? b.over_odds : b.under_odds, over ? (a, b) => b - a : (a, b) => a - b);
        if (r) total = {...r, label: l => `${over ? "Over" : "Under"} ${f1(l)}`};
      }
    }
    // owner (24 Nov): moneyline too: our pick to win; no points, so the app that pays more is better
    let ml = null;
    if (g.p_home != null) {
      const home = g.p_home >= 0.5, team = home ? g.home : g.away, k = home ? "home_ml" : "away_ml";
      const r = pick(b => b[k] == null ? null : 0, b => b[k], () => 0);
      if (r) ml = {...r, sameLine: true, label: () => `${team} ML`};
    }
    if (spread || total || ml) out.push({g, game_id: g.game_id, spread, total, ml});
  }
  return out.sort((a, b) => byStart(a.g, b.g));
}
// our chance for a main line, same math as the game cards (normal curve; whole-number lines can push)
function lineChance(mean, sd, line) {
  const ncdf = x => { const z = Math.abs(x) / Math.SQRT2, t = 1 / (1 + 0.3275911 * z);
    const e = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z);
    return x >= 0 ? (1 + e) / 2 : (1 - e) / 2; };
  if (Number.isInteger(line)) { const hi = ncdf((line + 0.5 - mean) / sd), lo = ncdf((line - 0.5 - mean) / sd); return (1 - hi) / ((1 - hi) + lo); }
  return 1 - ncdf((line - mean) / sd);
}

      ${dogX ? `<span class="np"><b>When we disagreed with ${esc(BN)}</b> and picked the underdog, our pick won <b>${pc(dogX[0].wdog_right, dogX[0].wdog_n)}</b> (${dogX[0].wdog_right.toLocaleString()} of ${dogX[0].wdog_n.toLocaleString()} games, ${dogX[1]}).</span>` : ""}
      <span class="np">Green = the better number in that column (more winners).</span>
      ${soFar ? `<span class="np">${soFar.replace(/^ /, "").replace(/^so far/, "So far")}.</span>` : ""}${playing ? `<span class="np">${playing} game${playing === 1 ? "" : "s"} still playing.</span>` : ""}</div>
    ${more(`<span class="np">${esc(BNs)} favorite = the team with the minus (−) odds.</span>
      <span class="np">If both teams have the same odds, ${esc(BN)} has no favorite, so that game is left out.</span>
      ${gone("When odds first came out", O)}${gone("Right before the game", C)}
      <span class="np"><b>When odds first came out</b> = the first odds posted for the game (the "opening line").</span>
      <span class="np tight"><b>Right before the game</b> = the last odds before tip-off (the "closing line"). The odds can move in between, so ${esc(BNs)} favorite can change.</span>`)}

// owner 27 Nov ("the odds are different for every pick... show how accurate our predictions are at the opening and
// closing odds, and how they compare to the sportsbook's"): spread = the final score difference, Over/Under = the final
// total points. Each box: average points off, ours vs the book's line, at both times (lower = more accurate), plus how
// often each number was the closer one. No betting record and no fixed −110 / 52.4% any more.
function splitBox(label, O, C, kind, BN, soFar, T) {
  const BNs = BN.endsWith("s") ? BN + "'" : BN + "'s", pre = kind === "spread" ? "sp" : "tt";
  const line = kind === "spread" ? `${BNs} spread` : `${BNs} Over/Under line`;
  const what = kind === "spread" ? "real winning margin (how many points the winner won by)" : "real total points (both teams' points added up)";
  const N = X => X && X[pre + "_miss_n"], f1 = v => v.toFixed(1);
  const cell = (X, mine, other) => { const n = N(X); if (!n) return `<td class="muted">–</td>`;
    const a = X[pre + mine], b = X[pre + other], good = a < b - 0.0005;
    return `<td class="${good ? "good" : ""}">${f1(a)}<span class="cnt">points off</span></td>`; };
  const say = (name, X) => { const n = N(X); if (!n) return "";
    const u = X[pre + "_miss_us"], b = X[pre + "_miss_bk"], d = Math.abs(u - b);
    const head = d < 0.05 ? `we and ${esc(BN)} were about equally accurate` : u < b ? `<b>our prediction was more accurate</b>, by ${f1(d)} point${f1(d) === "1.0" ? "" : "s"} a game`
      : `<b>${esc(BNs)} line was more accurate</b>, by ${f1(d)} point${f1(d) === "1.0" ? "" : "s"} a game`;
    const cn = X[pre + "_n"], cu = X[pre + "_us"];
    const closer = cn ? ` Our number was the closer one in ${cu.toLocaleString()} of ${cn.toLocaleString()} games, ${esc(BNs)} in ${(cn - cu).toLocaleString()}.` : "";
    return `<span class="np"><b>${name}:</b> ${head} (${f1(u)} vs ${f1(b)} points off, ${n.toLocaleString()} games).${closer}</span>`; };
  const gone = (name, X) => !X ? "" : leftOut(name, T, N(X) || 0, [[T - (N(X) || 0), `had no ${esc(BN)} line saved`]]);
  const ex = kind === "spread"
    ? `we predicted the Knicks to win by 7, ${esc(BNs)} spread was Knicks −9.5, and the Knicks won by 5. We were 2 points off, ${esc(BN)} 4.5`
    : `we predicted 218 points, ${esc(BNs)} Over/Under line was 222.5, and the game ended with 220. We were 2 points off, ${esc(BN)} 2.5`;
  return `<div class="stat"><div class="label">${kind === "spread" ? "Who predicts the score difference better" : "Who predicts the total points better"}: us or ${esc(BN)}?</div>
    <div class="what">On average, how many points each prediction was off from the ${what}. <b>Fewer points off = more accurate.</b></div>
    <table class="bktable wintable"><tr><th></th><th><span class="lg">When odds first came out</span><span class="sm">Odds first out</span></th>
      <th><span class="lg">Right before the game</span><span class="sm">Before the game</span></th></tr>
      <tr><td>Our prediction</td>${cell(O, "_miss_us", "_miss_bk")}${cell(C, "_miss_us", "_miss_bk")}</tr>
      <tr><td>${line}</td>${cell(O, "_miss_bk", "_miss_us")}${cell(C, "_miss_bk", "_miss_us")}</tr></table>
    <div class="note">${say("Right before the game", C)}${say("When odds first came out", O)}
      <span class="np">Green = the better number in that column (fewer points off).</span>
      ${soFar ? `<span class="np">${soFar.replace(/^ /, "").replace(/^so far/, "So far")}.</span>` : ""}</div>
    ${more(`<span class="np"><b>Example:</b> ${ex}.</span>
      <span class="np">${kind === "spread" ? `${esc(BNs)} spread is its prediction of the winning margin: Knicks −9.5 means it expects the Knicks to win by about 9.5.` : `${esc(BNs)} Over/Under line is its prediction of the total points.`}</span>
      <span class="np">When both numbers were equally close, the game counts for neither in "the closer one".</span>
      ${gone("When odds first came out", O)}${gone("Right before the game", C)}
      <span class="np"><b>When odds first came out</b> = the first line posted for the game (the "opening line").</span>
      <span class="np tight"><b>Right before the game</b> = the last line before tip-off (the "closing line").</span>`)}
  </div>`;
}

// owner (23 Nov): opening line vs closing line, split favorite / underdog and Over / Under, at the chosen sportsbook
function bookTable(C, O, BN) {
  const n = r => r.won + r.lost;
  const rt = r => n(r) ? r.won / n(r) : null;
  const cell = (r, other) => !n(r) ? `<td class="muted">–</td>` :
    `<td class="${rt(other) != null && rt(r) > rt(other) + 0.0005 ? "good" : ""}">${(100 * r.won / n(r)).toFixed(1)}%<small>${r.won}-${r.lost}</small></td>`;
  const row = (label, k, sub) => `<tr><td class="${sub ? "sub" : ""}">${label}</td>${cell(O[k], C[k])}${cell(C[k], O[k])}</tr>`;
  const BNs = BN.endsWith("s") ? BN + "'" : BN + "'s";
  // picking the winner: us vs the book on the same games (games where the book had no favorite are left out)
  const wp = (X, who) => !X.ml_games ? `<td class="muted">–</td>` : (() => {
    const a = (who === "us" ? X.us_right : X.book_right) / X.ml_games, b = (who === "us" ? X.book_right : X.us_right) / X.ml_games;
    return `<td class="${a > b + 0.0005 ? "good" : ""}">${(100 * a).toFixed(1)}%</td>`; })();
  const short = ({DraftKings: "DK", FanDuel: "FD"})[BN] || BN;   // tiny phones: "DK" / "FD"
  const who = X => X.brier_us == null || X.brier_book == null ? "–" : X.brier_us < X.brier_book - 0.0005 ? "Us"
    : X.brier_book < X.brier_us - 0.0005 ? `<span class="lg">${esc(BN)}</span><span class="sm">${short}</span>` : "Tied";
  return `<div class="panel bkpanel" style="margin-top:12px;padding:6px 14px;overflow:hidden">
    <table class="bktable">
      <tr><th>${esc(BN)}</th><th><span class="lg">Opening line</span><span class="sm">Opening</span></th><th><span class="lg">Closing line</span><span class="sm">Closing</span></th></tr>
      ${row("Spread picks", "spread")}${row(`<span class="lg">Our pick was the favorite (−)</span><span class="sm">Pick: favorite (−)</span>`, "fav", 1)}${row(`<span class="lg">Our pick was the underdog (+)</span><span class="sm">Pick: underdog (+)</span>`, "dog", 1)}
      ${row("Over / under picks", "total")}${row(`<span class="lg">Our pick was the Over</span><span class="sm">Pick: Over</span>`, "over", 1)}${row(`<span class="lg">Our pick was the Under</span><span class="sm">Pick: Under</span>`, "under", 1)}
      <tr><td>Closer win chances</td><td>${who(O)}</td><td>${who(C)}</td></tr>
    </table></div>
    <p class="intro" style="margin-top:10px">
      <span class="np"><b>Opening line</b> = ${esc(BNs)} first line for the game, checked against our prediction from the day before.</span>
      <span class="np"><b>Closing line</b> = ${esc(BNs)} last line before the game started, checked against our final prediction. This is the fairest test:
      by then both of us know the injury news and the starting lineups.</span>
      <span class="np">We make <b>one pick per game</b>. The indented rows split those picks into groups: games where the team we picked was the
        favorite (−) or the underdog (+), and games where we picked the Over or the Under.</span>
      <span class="np"><b>Green</b> = the better of the two lines in that row.</span>
      <span class="np">To make money you need to win <b>52.4%</b> or more, because you bet $110 to win $100.</span>
      <span class="np"><b>Closer win chances</b> = whose percentages (like "70% to win") matched what really happened better.</span></p>`;
}

function trustBlock() {
  return `
    <h2 class="section-title">Can you trust our percentages?</h2>
    ${(() => {   // owner (24 Nov): "a table that tracks the amount of bets we predicted w their % and out of that range how
                 // many we got right": every graded winner pick, grouped by how sure we were (our chance for the team we picked)
      const G = (state.resGames || []).filter(g => g.c != null && g.ok != null);
      if (!G.length) return `<p class="trustline">Loading our picks…</p>`;
      const bins = [[0.5, 0.55], [0.55, 0.6], [0.6, 0.65], [0.65, 0.7], [0.7, 0.8], [0.8, 0.9], [0.9, 1.01]];
      const rows = bins.map(([lo, hi]) => { const X = G.filter(g => g.c >= lo && g.c < hi), w = X.filter(g => g.ok).length;
        return {lo, hi, n: X.length, w}; }).filter(r => r.n);
      const lbl = r => `${Math.round(r.lo * 100)}–${Math.min(100, Math.round(r.hi * 100))}%`;
      const first = G.reduce((m, g) => g.d < m ? g.d : m, G[0].d);
      const since = new Date(first + "T12:00").toLocaleDateString("en-US", {month: "short", year: "numeric"});
      return `<p class="trustline"><b>All time, since ${since}:</b> every winner pick we've made (${G.length.toLocaleString()} games), grouped by how sure we were.
          If our percentages are honest, <b>% right</b> lands inside the range.</p>
        <div class="panel" style="margin-top:12px"><table class="data calib"><tr><th>How sure we were</th><th class="num">Picks</th><th class="num">Got right</th><th class="num">% right</th></tr>
        ${rows.map(r => { const p = r.w / r.n, inside = p >= r.lo && p < r.hi;   // ✅ only when % right is really inside the range
          return `<tr><td>${lbl(r)}</td><td class="num">${r.n.toLocaleString()}</td><td class="num">${r.w.toLocaleString()}</td>
            <td class="num"><b>${pct(p)}</b> ${inside ? "✅" : "⚠️"}</td></tr>`; }).join("")}
        </table></div>
        ${(() => {   // owner (25 Nov): say exactly what ✅ / ⚠️ mean, and explain every ⚠️ row in plain words
          const off = rows.filter(r => { const p = r.w / r.n; return !(p >= r.lo && p < r.hi); });
          const why = off.map(r => { const p = r.w / r.n, mid = (r.lo + Math.min(r.hi, 1)) / 2, edge = p < r.lo ? r.lo : Math.min(r.hi, 1);
            const luck = 2 * Math.sqrt(mid * (1 - mid) / r.n);   // how far normal luck can move a group this size
            const gap = Math.abs(p - edge);
            return `<span class="np">⚠️ <b>${lbl(r)}:</b> we gave these ${r.n.toLocaleString()} picks a ${lbl(r)} chance to win, but they won
              <b>${pct(p)}</b> of the time, ${(100 * gap).toFixed(1)} points ${p < r.lo ? "lower" : "higher"} than that.
              ${gap <= luck ? `With ${r.n.toLocaleString()} picks, luck alone can move the result by about ${(100 * luck).toFixed(0)} points, so this is most likely luck, not a problem with our percentages.`
                : `That's more than luck usually explains, so our percentages in this group run ${p < r.lo ? "too high" : "too low"}.`}</span>`; }).join("");
          return `<p class="intro" style="margin-top:10px;color:var(--text);font-size:14px">
            <span class="np">✅ = these picks won about as often as we said they would (the % right is inside the range in the first column).</span>
            <span class="np">⚠️ = these picks won more often or less often than we said (the % right is outside the range).</span>${why}</p>`;
        })()}`;
    })()}
  `;
}

function accuracyView() {
  const b = state.back;
  if (!b || !b.layers) return trustBlock() + resultsBlock() + `<div class="empty">Run <code>python3 backtest.py --save</code> to see this page.</div>`;
  // plain names for the backtest rows (owner, 21 Nov: beginner-friendly, no "opening/closing line", no "-110")
  const nm = n => n.replace(" at the opening line", " · bet early").replace(" at the closing line", " · bet at tip-off")
    .replace("Total picks", "Over / under picks");
  const ln = n => ({"Team ratings only": "Team strength only", "+ injuries (day before)": "+ injury news",
    "+ lineups known": "+ confirmed starting lineups (what we use)", "Sportsbook opening line": "DraftKings' first line",
    "Sportsbook closing line": "DraftKings' last line before tip-off",
    "FanDuel opening line": "FanDuel's first line", "FanDuel closing line": "FanDuel's last line before tip-off"})[n] || n;
  const barsP = (key, floor) => {
    const top = Math.max(...b.layers.map(x => x[key]));
    return b.layers.map(l => `<div class="row"><span>${esc(ln(l.name))}</span><div class="track"><div class="fill ${l.name.includes("line") ? "book" : ""}"
      style="width:${Math.max(4, 100 * (l[key] - floor) / (top - floor))}%"></div></div><span class="num"><b>${l[key].toFixed(2)}</b></span></div>`).join("");
  };
  // owner (23 Nov): the "How often our picks won (older games)" boxes were removed: the All time tab shows the same numbers
  // owner (24 Nov): the picks-by-how-sure table goes FIRST on the Results tab
  return trustBlock() + resultsBlock() + `<p class="intro">We tested the model on <b>${b.games.toLocaleString()}</b> older games (${esc(b.from)} – ${esc(b.to)}),
    predicting each one using only what was known before it was played.</p>
    <h2 class="section-title">How close were our predicted scores? (shorter bar = better)</h2>
    <p class="intro">Each bar is how many points we were off per game, on average. Each row gives the model one more piece of information.
      The last four rows are DraftKings and FanDuel, for comparison.</p>
    <div class="panel bars"><div class="note" style="margin:0 0 6px;color:var(--muted)">How much the winner wins by</div>${barsP("margin", 10)}</div>
    <div class="panel bars" style="margin-top:10px"><div class="note" style="margin:0 0 6px;color:var(--muted)">Both teams' points added together</div>${barsP("total", 13.5)}</div>
    `;
}

(function scoreLoop() {
  const anyLive = () => Object.values(state.live || {}).some(v => v && v.state === "in");
  // a game about to tip (10 min) or past its start time but not marked live/final yet: check fast so tip-off isn't missed
  const soonStart = () => ((state.pred || {}).games || []).some(g => { const t = Date.parse(String(g.start_utc).replace(" ", "T"));
    const st = ((state.live || {})[`${g.away}@${g.home}`] || {}).state; return t && t - Date.now() < 10 * 60e3 && Date.now() - t < 4 * 3600e3 && st !== "post"; });
  let timer = null;
  const next = () => { clearTimeout(timer); if (document.hidden) return;
    const backoff = pollScores.errAt && Date.now() - pollScores.errAt < 120e3;
    timer = setTimeout(run, backoff ? 30e3 : (anyLive() || soonStart()) ? 5e3 : 60e3); };
  const run = async () => {

    if (!document.hidden) { try { await pollScores(); } catch (_) {} } next(); };
  document.addEventListener("visibilitychange", () => { if (!document.hidden) run(); else clearTimeout(timer); });
  setTimeout(run, 1500);
})();

function staleCheck() {
  const p = state.pred || {}, el = document.getElementById("stale");
  if (!el || !p.made_at_iso) return;
  const mins = (Date.now() - new Date(p.made_at_iso).getTime()) / 60000;
  const etHour = Number(new Date().toLocaleString("en-US", {timeZone: "America/New_York", hour: "numeric", hour12: false}));
  const limit = etHour >= 1 && etHour < 6 ? 90 : 30;
  if (mins <= limit) { el.hidden = true; return; }
  const age = mins < 120 ? `${Math.round(mins)} minutes` : `${Math.round(mins / 60)} hours`;
  el.innerHTML = `⚠️ <b>These picks are ${age} old.</b> They normally refresh every 15 minutes, so the updater may be down. Lines and injury news may have changed: don't bet on these numbers until this warning goes away.`;
  el.hidden = false;
}

<script>
(function () {   // REDESIGN 27 Nov: pull down at the top of the page to fetch the newest picks right away
  const el = document.createElement("div"); el.id = "ptr"; el.innerHTML = `<span class="sp"><i>↓</i></span><span class="tx">Pull to refresh</span>`;
  document.body.appendChild(el);
  const tx = el.querySelector(".tx"), arrow = el.querySelector("i"), MAX = 110, GO = 70;
  let y0 = null, pull = 0, busy = false;
  const set = d => { pull = d; el.style.setProperty("--pull", d + "px"); el.style.setProperty("--pp", Math.min(1, d / GO).toFixed(3));
    el.classList.toggle("show", d > 6); el.classList.toggle("ready", d >= GO);
    tx.textContent = d >= GO ? "Release to refresh" : "Pull to refresh"; arrow.textContent = "↓"; };
  const reset = () => { el.classList.add("snap"); set(0); el.classList.remove("ready", "busy", "done"); setTimeout(() => el.classList.remove("snap"), 400); };
  document.addEventListener("touchstart", e => {
    if (busy || window.scrollY > 0 || e.touches.length !== 1 || e.target.closest("input, textarea, .parlay-bar")) { y0 = null; return; }
